<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="446" fill="#ffffff"/>

  <!-- ===== Failure evidence ===== -->
  <rect x="210" y="22" width="200" height="34" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="310" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(310.00001525878906 0) scale(0.6834506004187516 1) translate(-310.00001525878906 0)" data-ru-fit="0.6835">Зарегистрированы доказательства отказа.</text>
  <path d="M310,56 V74" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 1: evidence class (selects which lanes exist) ===== -->
  <rect x="30" y="76" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1 · Класс доказательств</text>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="#475569">что известно об эффекте?</text>

  <path d="M100,120 V144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M385,120 V144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- candidate groups (dashed = candidates, not yet admitted) -->
  <rect x="30" y="146" width="140" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="100" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(100.0000171661377 0) scale(0.9021881684670253 1) translate(-100.0000171661377 0)" data-ru-fit="0.9022">Результат неизвестен.</text>
  <rect x="180" y="146" width="410" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="385" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Отклонено или установлено</text>

  <!-- lanes: group to gate 2 (every candidate enters) -->
  <path d="M100,180 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M240,180 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M380,180 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M520,180 V214" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Gate 2: admissibility (filter) ===== -->
  <rect x="30" y="216" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2 · Допустимость</text>
  <text x="310" y="252" text-anchor="middle" font-size="12" fill="#475569">полномочия · лимит с резервом завершения · крайний срок</text>

  <!-- none admissible exit -->
  <path d="M590,238 H680 V374" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="672" y="306" text-anchor="end" font-size="12" fill="#b91c1c">нет</text>
  <text x="672" y="321" text-anchor="end" font-size="12" fill="#b91c1c" transform=" translate(672.0000419616699 0) scale(0.9476097235729077 1) translate(-672.0000419616699 0)" data-ru-fit="0.9476">допустимо</text>

  <!-- lanes: gate 2 to gate 3 (dashed = only admissible candidates survive) -->
  <path d="M100,260 V294" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M240,260 V294" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M380,260 V294" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <path d="M520,260 V294" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="170" y="281" text-anchor="middle" font-size="12" font-style="italic" fill="#475569" transform=" translate(170.00000381469727 0) scale(0.7223696419058281 1) translate(-170.00000381469727 0)" data-ru-fit="0.7224">только выжившие</text>

  <!-- ===== Gate 3: expected cost (ranks survivors) ===== -->
  <rect x="30" y="296" width="560" height="44" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="310" y="315" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3 · Ожидаемая стоимость в согласованной конечной точке</text>
  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#475569">сначала отремонтируй, когда <tspan font-style="italic">p</tspan> &gt; <tspan font-style="italic">C</tspan><tspan font-size="12" dy="3">repair</tspan><tspan dy="-3"> / </tspan><tspan font-style="italic">C</tspan><tspan font-size="12" dy="3">fallback</tspan><tspan dy="-3">, по оси (секунды, доллары)</tspan></text>

  <!-- lanes: gate 3 to actions -->
  <path d="M100,340 V374" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M240,340 V374" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M380,340 V374" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M520,340 V374" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="170" y="361" text-anchor="middle" font-size="12" font-style="italic" fill="#475569" transform=" translate(169.71240234375 0) scale(0.5046429780477396 1) translate(-169.71240234375 0)" data-ru-fit="0.5046">ранжировано по стоимости</text>

  <!-- ===== Recovery actions ===== -->
  <rect x="40" y="376" width="120" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(100.02387619018555 0) scale(0.8882234406009508 1) translate(-100.02387619018555 0)" data-ru-fit="0.8882">Повторить попытку</text>
  <text x="100" y="414" text-anchor="middle" font-size="12" fill="#475569">та же операция</text>

  <rect x="180" y="376" width="120" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="240" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(239.9999771118164 0) scale(0.8518479676365921 1) translate(-239.9999771118164 0)" data-ru-fit="0.8518">Новое предложение</text>

  <rect x="320" y="376" width="120" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Ремонт</text>
  <text x="380" y="414" text-anchor="middle" font-size="12" fill="#475569" transform=" translate(380.00001525878906 0) scale(0.7413082014439749 1) translate(-380.00001525878906 0)" data-ru-fit="0.7413">используя обратную связь</text>

  <rect x="460" y="376" width="120" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Компенсация</text>

  <rect x="620" y="376" width="120" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(679.9675559997559 0) scale(0.9845913922276797 1) translate(-679.9675559997559 0)" data-ru-fit="0.9846">Удерживайте или</text>
  <text x="680" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(680.0000076293945 0) scale(0.7313777887811619 1) translate(-680.0000076293945 0)" data-ru-fit="0.7314">передать на эскалацию</text>
