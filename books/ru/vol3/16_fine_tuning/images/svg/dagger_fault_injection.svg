    <text x="610" y="326" font-weight="400"><tspan font-style="italic">π</tspan><tspan font-size="11" font-style="italic" dy="3">k</tspan><tspan font-size="11" dy="0">+1</tspan></text>
  </g>
  <g font-size="12" text-anchor="middle">
