    <text x="502" y="326" font-size="11" fill="#6d28d9" transform=" translate(502.00001525878906 0) scale(0.9402921983613555 1) translate(-502.00001525878906 0)" data-ru-fit="0.9403"><tspan font-style="italic">D</tspan><tspan font-size="10.6" font-style="italic" dy="3">k</tspan><tspan font-size="10.6" dy="0">+1</tspan><tspan dx="1" dy="-3">=</tspan><tspan dx="1" font-style="italic">D</tspan><tspan font-size="10.6" font-style="italic" dy="3">k</tspan><tspan dx="1" dy="-3">∪</tspan><tspan dx="1">новый</tspan></text>
  </g>
