  <text x="450" y="258" text-anchor="middle" font-size="12" fill="#475569" transform=" translate(450.00000381469727 0) scale(0.5632582558492596 1) translate(-450.00000381469727 0)" data-ru-fit="0.5633">следующий раунд</text>

