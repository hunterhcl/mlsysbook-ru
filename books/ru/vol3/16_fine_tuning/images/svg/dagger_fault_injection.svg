  <text x="270" y="200" text-anchor="middle" font-size="12" fill="#b91c1c" transform=" translate(269.99999237060547 0) scale(0.804900828826619 1) translate(-269.99999237060547 0)" data-ru-fit="0.8049">нет записанной коррекции</text>

