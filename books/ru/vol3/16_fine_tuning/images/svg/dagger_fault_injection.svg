  <line x1="20" y1="218" x2="658" y2="218" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ===== Panel b: labeling rounds ===== -->
  <text x="20" y="246" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(20 0) scale(0.6272502022231076 1) translate(-20 0)" data-ru-fit="0.6273">(b) Маркировка состояний, посещенных учащимся</text>

