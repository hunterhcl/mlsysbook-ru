    <text x="70" y="307">Беги <tspan font-style="italic" font-weight="400">π</tspan><tspan font-size="11" font-style="italic" font-weight="400" dy="3">k</tspan></text>
    <text x="178" y="307">Посетил</text>
    <text x="178" y="324">состояния</text>
    <text x="286" y="307" transform=" translate(286.04122161865234 0) scale(0.8772973719840796 1) translate(-286.04122161865234 0)" data-ru-fit="0.8773">Этикетировщик</text>
    <text x="286" y="324">предлагает</text>
    <text x="394" y="307">Песочница</text>
    <text x="394" y="324">верификатор</text>
