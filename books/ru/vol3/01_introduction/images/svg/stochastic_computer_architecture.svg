<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="800" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- ===== Live loop band ===== -->
  <rect x="60" y="20" width="720" height="350" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="80" y="44" font-size="13" font-weight="700" fill="#334155" transform=" translate(79.9219970703125 0) scale(0.7057215477589133 1) translate(-79.9219970703125 0)" data-ru-fit="0.7057">Живой цикл</text>
  <text x="760" y="44" text-anchor="end" font-size="13" fill="#475569" transform=" translate(760 0) scale(0.7994641552326054 1) translate(-760 0)" data-ru-fit="0.7995">одна траектория, шаг за шагом</text>

  <!-- Model (Part I) -->
  <rect x="80" y="60" width="300" height="56" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="84" font-size="15" font-weight="700" fill="#0f172a">Модель</text>
  <text x="364" y="84" text-anchor="end" font-size="13" fill="#475569">Часть I</text>
  <text x="96" y="104" font-size="13" font-style="italic" fill="#0369a1">≈ процессор</text>

  <!-- Agent memory (Part II) -->
  <rect x="460" y="60" width="300" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="476" y="84" font-size="15" font-weight="700" fill="#0f172a">Память агента</text>
  <text x="744" y="84" text-anchor="end" font-size="13" fill="#475569">Часть II</text>
  <text x="476" y="104" font-size="13" font-style="italic" fill="#15803d">≈ иерархия памяти</text>

  <!-- Agent runtime (Part IV), spans the band: every edge passes through it -->
  <rect x="80" y="176" width="680" height="56" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="96" y="200" font-size="15" font-weight="700" fill="#0f172a">Среда исполнения агента</text>
  <text x="744" y="200" text-anchor="end" font-size="13" fill="#475569">Часть IV</text>
  <text x="96" y="220" font-size="13" font-style="italic" fill="#6d28d9">≈ операционная система</text>

  <!-- Tool use (Part III) -->
  <rect x="80" y="292" width="380" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="316" font-size="15" font-weight="700" fill="#0f172a">Использование инструментов</text>
  <text x="444" y="316" text-anchor="end" font-size="13" fill="#475569">Часть III</text>
  <text x="96" y="336" font-size="13" font-style="italic" fill="#b45309">≈ ввод и вывод</text>

  <!-- Environment (outside the agent) -->
  <rect x="540" y="292" width="220" height="56" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="556" y="316" font-size="15" font-weight="700" fill="#0f172a">Окружающая среда</text>
  <text x="556" y="336" font-size="13" fill="#475569">репозитории, сервисы</text>

  <!-- Model <-> runtime -->
  <path d="M160,116 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="168" y="150" font-size="13" fill="#334155" transform=" translate(168 0) scale(0.6117381489841986 1) translate(-168 0)" data-ru-fit="0.6117">предложение</text>
  <path d="M300,176 V116" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="308" y="150" font-size="13" fill="#334155" transform=" translate(308 0) scale(0.8007464829170255 1) translate(-308 0)" data-ru-fit="0.8007">контекст</text>
  <!-- Memory <-> runtime -->
  <path d="M540,116 V176" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="548" y="150" font-size="13" fill="#334155" transform=" translate(548 0) scale(0.47254273504273503 1) translate(-548 0)" data-ru-fit="0.4725">сохраненное состояние</text>
  <path d="M680,176 V116" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="688" y="150" font-size="13" fill="#334155" transform=" translate(688 0) scale(0.8887648809523809 1) translate(-688 0)" data-ru-fit="0.8888">запись</text>
  <!-- Runtime <-> tools -->
  <path d="M160,232 V292" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="168" y="266" font-size="13" fill="#334155" transform=" translate(168 0) scale(0.5180889550968291 1) translate(-168 0)" data-ru-fit="0.5181">подтвержденный вызов</text>
  <path d="M340,292 V232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="348" y="266" font-size="13" fill="#334155" transform=" translate(348 0) scale(0.9042089985486212 1) translate(-348 0)" data-ru-fit="0.9042">наблюдение</text>
  <!-- Tools <-> environment -->
  <path d="M460,308 H540" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="500" y="301" text-anchor="middle" font-size="13" fill="#334155" transform=" translate(500 0) scale(0.6833989501312336 1) translate(-500 0)" data-ru-fit="0.6834">эффект</text>
  <path d="M540,332 H460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="500" y="350" text-anchor="middle" font-size="13" fill="#334155" transform=" translate(500 0) scale(0.5207267144319345 1) translate(-500 0)" data-ru-fit="0.5207">результат</text>

  <!-- ===== Across-tasks band ===== -->
  <rect x="60" y="420" width="720" height="96" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="80" y="444" font-size="13" font-weight="700" fill="#334155">По задачам</text>

  <!-- Learning from trajectories (Part V) -->
  <rect x="80" y="452" width="300" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="474" font-size="15" font-weight="700" fill="#0f172a">Обучение на траекториях</text>
  <text x="364" y="474" text-anchor="end" font-size="13" fill="#475569">Часть V</text>
  <text x="96" y="493" font-size="13" font-style="italic" fill="#0369a1">≈ перекомпиляция</text>

  <!-- Agents at scale (Part VI): a stack of live loops -->
  <rect x="480" y="436" width="280" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="470" y="444" width="280" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="460" y="452" width="280" height="50" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="476" y="474" font-size="15" font-weight="700" fill="#0f172a" transform=" translate(475.9100036621094 0) scale(0.9416022102315381 1) translate(-475.9100036621094 0)" data-ru-fit="0.9416">Агенты в большом масштабе</text>
  <text x="724" y="474" text-anchor="end" font-size="13" fill="#475569">Часть VI</text>
  <text x="476" y="493" font-size="13" font-style="italic" fill="#475569">≈ масштабирование</text>

  <!-- Live loop -> across tasks -->
  <path d="M230,370 V452" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="238" y="400" font-size="13" fill="#334155" transform=" translate(238 0) scale(0.8837364100288441 1) translate(-238 0)" data-ru-fit="0.8837">оцененные траектории</text>
  <path d="M620,370 V436" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="628" y="400" font-size="13" fill="#334155" transform=" translate(628 0) scale(0.6068376068376068 1) translate(-628 0)" data-ru-fit="0.6068">много одновременно</text>

  <!-- Updated weights: perimeter feedback to the model -->
  <path d="M80,477 H40 V88 H80" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="30" y="282" text-anchor="middle" font-size="13" fill="#0369a1" transform="rotate(-90 30 282) translate(30 0) scale(0.9798075406215492 1) translate(-30 0)" data-ru-fit="0.9798">обновлены веса</text>
