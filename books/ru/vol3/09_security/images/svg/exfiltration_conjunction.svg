  <text x="325" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c" transform=" translate(325.0404586791992 0) scale(0.48681704017725075 1) translate(-325.0404586791992 0)" data-ru-fit="0.4868">злоумышленник</text>
  <text x="325" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c" transform=" translate(325.00002098083496 0) scale(0.9244516671856639 1) translate(-325.00002098083496 0)" data-ru-fit="0.9245">контент</text>
  <path d="M322,130 L328,110" stroke="#475569" stroke-width="1.5"/>
