  </defs>
  <rect width="800" height="290" fill="#ffffff"/>

  <!-- ===== Endpoints of the disclosure path ===== -->
  <rect x="20" y="92" width="100" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Частный</text>
  <text x="70" y="134" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d" transform=" translate(70.00000286102295 0) scale(0.8220401711292998 1) translate(-70.00000286102295 0)" data-ru-fit="0.8220">приспособление</text>
  <rect x="690" y="92" width="90" height="56" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
