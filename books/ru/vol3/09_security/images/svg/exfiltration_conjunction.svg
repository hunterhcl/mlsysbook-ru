  <rect x="269" y="180" width="112" height="80" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="325" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">На карантине</text>
  <text x="325" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">читатель</text>
  <text x="325" y="243" text-anchor="middle" font-size="13" fill="#475569" transform=" translate(325 0) scale(0.8577315812258376 1) translate(-325 0)" data-ru-fit="0.8577">сужает экспозицию</text>
  <line x1="380" y1="120" x2="400" y2="120" stroke="#64748b" stroke-width="1.5"/>
