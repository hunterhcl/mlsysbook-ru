  <text x="455" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" transform=" translate(455.0000114440918 0) scale(0.8228505368117525 1) translate(-455.0000114440918 0)" data-ru-fit="0.8229">исходящий</text>
  <text x="455" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" transform=" translate(455.0000114440918 0) scale(0.7330699521766145 1) translate(-455.0000114440918 0)" data-ru-fit="0.7331">получатель</text>
  <path d="M448,130 L454,110 M456,130 L462,110" stroke="#475569" stroke-width="1.5"/>
  <line x1="455" y1="134" x2="455" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="399" y="180" width="112" height="80" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="455" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Выход</text>
  <text x="455" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">граница</text>
  <text x="455" y="243" text-anchor="middle" font-size="13" fill="#475569">нет поиска</text>

  <!-- ===== Dependency and recipient check before dispatch ===== -->
  <line x1="510" y1="120" x2="530" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <rect x="530" y="76" width="110" height="88" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="585" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Зависимость +</text>
  <text x="585" y="121" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">получатель</text>
  <text x="585" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">проверить</text>
