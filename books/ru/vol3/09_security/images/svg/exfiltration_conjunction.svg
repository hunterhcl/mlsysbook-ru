  <text x="195" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" transform=" translate(195.00000762939453 0) scale(0.7331949836094022 1) translate(-195.00000762939453 0)" data-ru-fit="0.7332">личные данные</text>
  <text x="195" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" transform=" translate(195 0) scale(0.4849226002588249 1) translate(-195 0)" data-ru-fit="0.4849">в досягаемости</text>
