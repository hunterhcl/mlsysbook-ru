  <text x="195" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">тестировщик</text>
  <text x="195" y="243" text-anchor="middle" font-size="13" fill="#475569" transform=" translate(195 0) scale(0.7782167768344576 1) translate(-195 0)" data-ru-fit="0.7782">результат, а не байты</text>
