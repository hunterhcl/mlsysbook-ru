  <text x="735" y="134" text-anchor="middle" font-size="13" fill="#7f1d1d">на службе</text>

  <!-- ===== Bracket: the three connections lie on one path ===== -->
  <path d="M140,62 V56 H510 V62" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="325" y="48" text-anchor="middle" font-size="13" fill="#475569" transform=" translate(325.00001525878906 0) scale(0.8279163661845562 1) translate(-325.00001525878906 0)" data-ru-fit="0.8279">все трое на одном пути</text>

