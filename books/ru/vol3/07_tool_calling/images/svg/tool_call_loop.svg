<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="405" fill="#ffffff"/>

  <!-- Model, turn t -->
  <rect x="20" y="40" width="120" height="110" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="80" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Модель</text>
  <text x="80" y="82" text-anchor="middle" font-size="12.5" fill="#334155">поверните т</text>
  <text x="80" y="104" text-anchor="middle" font-size="12" fill="#0369a1" font-family="Menlo, Courier New, monospace">call_1</text>
  <text x="80" y="120" text-anchor="middle" font-size="12" fill="#0369a1" font-family="Menlo, Courier New, monospace">call_2</text>
  <text x="80" y="136" text-anchor="middle" font-size="12" fill="#0369a1" font-family="Menlo, Courier New, monospace">call_3</text>

  <!-- Runtime: the wall between model and environment -->
  <rect x="170" y="20" width="400" height="240" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="184" y="40" font-size="13" font-weight="700" fill="#6d28d9">Среда исполнения</text>

  <!-- Outbound row -->
  <rect x="190" y="56" width="100" height="56" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="240" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Подтвердить</text>
  <text x="240" y="98" text-anchor="middle" font-size="12.5" fill="#475569">схема</text>

  <rect x="320" y="56" width="100" height="56" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="370" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(369.9580307006836 0) scale(0.8141439792196398 1) translate(-369.9580307006836 0)" data-ru-fit="0.8141">Авторизоваться</text>
  <text x="370" y="98" text-anchor="middle" font-size="12.5" fill="#475569">грант</text>

  <rect x="450" y="56" width="100" height="56" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Отправка</text>
  <text x="500" y="98" text-anchor="middle" font-size="12.5" fill="#475569" transform=" translate(500.00000762939453 0) scale(0.6679810224999699 1) translate(-500.00000762939453 0)" data-ru-fit="0.6680">отслеживать результат</text>

  <!-- Return row -->
  <rect x="450" y="172" width="100" height="56" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="500" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Форма</text>
  <text x="500" y="214" text-anchor="middle" font-size="12.5" fill="#475569" transform=" translate(499.99999237060547 0) scale(0.6358974703068748 1) translate(-499.99999237060547 0)" data-ru-fit="0.6359">связан, соответствует ID</text>

  <!-- Tool or environment -->
  <rect x="610" y="56" width="130" height="172" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="675" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Инструмент или</text>
  <text x="675" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(674.9999847412109 0) scale(0.8969254089179926 1) translate(-674.9999847412109 0)" data-ru-fit="0.8969">окружающая среда</text>
  <text x="675" y="170" text-anchor="middle" font-size="12.5" fill="#92400e">приземляется здесь</text>

  <!-- Forward path -->
  <path d="M140,84 H188" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M290,84 H318" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M420,84 H448" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M550,84 H608" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Return path -->
  <path d="M610,200 H552" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Context for turn t+1 -->
  <rect x="170" y="300" width="400" height="60" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="320" y="310" width="100" height="40" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="370" y="326" text-anchor="middle" font-size="12" fill="#b91c1c" font-family="Menlo, Courier New, monospace">call_2</text>
  <text x="370" y="342" text-anchor="middle" font-size="12.5" fill="#b91c1c">ошибка</text>
  <rect x="450" y="310" width="100" height="40" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="500" y="326" text-anchor="middle" font-size="12" fill="#15803d" font-family="Menlo, Courier New, monospace">call_1</text>
  <text x="500" y="342" text-anchor="middle" font-size="12.5" fill="#15803d">результат</text>
  <rect x="190" y="310" width="100" height="40" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="240" y="326" text-anchor="middle" font-size="12" fill="#b91c1c" font-family="Menlo, Courier New, monospace">call_3</text>
  <text x="240" y="342" text-anchor="middle" font-size="12.5" fill="#b91c1c">ошибка</text>
  <text x="370" y="380" text-anchor="middle" font-size="12.5" fill="#15803d" transform=" translate(370 0) scale(0.8451702143169914 1) translate(-370 0)" data-ru-fit="0.8452">контекст для хода t+1: одно наблюдение за вызов ID</text>

  <!-- Outcomes drop into their call-ID slots (drawn after the context so tips stay visible) -->
  <path d="M500,228 V308" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M240,112 V308" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="248" y="284" font-size="12.5" fill="#b91c1c" transform=" translate(248 0) scale(0.35101397085301206 1) translate(-248 0)" data-ru-fit="0.3510">недействительно</text>
  <path d="M370,112 V308" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="378" y="284" font-size="12.5" fill="#b91c1c" transform=" translate(378 0) scale(0.6058692663717702 1) translate(-378 0)" data-ru-fit="0.6059">не предоставлено</text>

  <!-- Next turn closes the loop -->
  <path d="M170,330 H80 V152" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="90" y="322" font-size="12.5" fill="#475569" transform=" translate(90.00000762939453 0) scale(0.536720726654179 1) translate(-90.00000762939453 0)" data-ru-fit="0.5367">следующий ход</text>
