<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 360" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <pattern id="omit" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="854" height="360" fill="#ffffff"/>

  <g transform="translate(10,0)">
  <!-- ===== Source: child process and adapter ===== -->
  <rect x="20" y="30" width="150" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Дочерний процесс</text>

  <rect x="10" y="96" width="170" height="150" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="95" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Адаптер</text>

  <rect x="20" y="124" width="70" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="55" y="143" text-anchor="middle" font-size="14" fill="#334155" font-family="Menlo, Courier New, monospace" transform=" translate(54.999996185302734 0) scale(0.42941998048714125 1) translate(-54.999996185302734 0)" data-ru-fit="0.4294">стандартный вывод</text>
  <rect x="100" y="124" width="70" height="28" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="135" y="143" text-anchor="middle" font-size="14" fill="#334155" font-family="Menlo, Courier New, monospace" transform=" translate(135.00000762939453 0) scale(0.42941992717914557 1) translate(-135.00000762939453 0)" data-ru-fit="0.4294">стандартный поток</text>
  <path d="M55,70 V122" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M135,70 V122" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <text x="95" y="172" text-anchor="middle" font-size="14" fill="#475569">ограниченные трубы</text>
  <rect x="20" y="184" width="150" height="50" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="95" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Цикл готовности</text>
  <text x="95" y="223" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(95.00001335144043 0) scale(0.5865575590498264 1) translate(-95.00001335144043 0)" data-ru-fit="0.5866">ограничение в байтах, крайний срок</text>
  <path d="M30,152 V182" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <path d="M160,152 V182" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ===== Optional retained record ===== -->
  <rect x="20" y="296" width="150" height="44" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="95" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(95.00001335144043 0) scale(0.984416708221138 1) translate(-95.00001335144043 0)" data-ru-fit="0.9844">Сохраненная запись</text>
  <text x="95" y="331" text-anchor="middle" font-size="14" fill="#6d28d9">если авторизовано</text>
  <path d="M95,246 V294" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  </g>

  <g transform="translate(26,0)">
  <!-- ===== The unbounded stream ===== -->
  <text x="200" y="50" font-size="14" fill="#475569" transform=" translate(200.00001525878906 0) scale(0.8059668076761864 1) translate(-200.00001525878906 0)" data-ru-fit="0.8060">выходной поток любой длины</text>
  <rect x="200" y="60" width="70" height="36" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="235" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">голова</text>
  <rect x="270" y="60" width="255" height="36" rx="0" fill="url(#omit)" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="308" y="70" width="180" height="18" rx="2" fill="#ffffff"/>
  <text x="398" y="83" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(398.00001525878906 0) scale(0.7187615617858638 1) translate(-398.00001525878906 0)" data-ru-fit="0.7188">средний: считается, не сохраняется</text>
  <rect x="525" y="60" width="70" height="36" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="560" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">хвост</text>
  <path d="M200,110 H593" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="595" y="126" text-anchor="end" font-size="14" fill="#64748b" transform=" translate(594.9999961853027 0) scale(0.6659340259655578 1) translate(-594.9999961853027 0)" data-ru-fit="0.6659">время</text>


  <!-- ===== Capture buffers: fixed memory ===== -->
  <rect x="190" y="138" width="430" height="132" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="405" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">память захвата: фиксированный размер</text>

  <!-- head buffer: linear, full -->
  <rect x="200" y="160" width="17.5" height="24" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="217.5" y="160" width="17.5" height="24" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="235" y="160" width="17.5" height="24" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="252.5" y="160" width="17.5" height="24" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="243" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(243.0000228881836 0) scale(0.9464361688598903 1) translate(-243.0000228881836 0)" data-ru-fit="0.9464">голова, <tspan font-style="italic">M</tspan><tspan font-size="14" dy="3">head</tspan></text>
  <text x="243" y="222" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(243.00003814697266 0) scale(0.6715650730017916 1) translate(-243.00003814697266 0)" data-ru-fit="0.6716">заполняется один раз</text>

  <!-- omission counter -->
  <rect x="350" y="158" width="100" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="400" y="177" text-anchor="middle" font-size="14" fill="#334155">+ байты</text>
  <text x="400" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">количество пропусков</text>
  <text x="400" y="222" text-anchor="middle" font-size="14" fill="#475569">байты не сохраняются</text>

  <!-- tail ring: 8 slots, overwrite oldest -->
  <circle cx="560" cy="172" r="17" fill="none" stroke="#bbf7d0" stroke-width="12"/>
  <circle cx="560" cy="172" r="17" fill="none" stroke="#ffffff" stroke-width="13" stroke-dasharray="1.5,11.85"/>
  <circle cx="560" cy="172" r="23" fill="none" stroke="#16a34a" stroke-width="1"/>
  <circle cx="560" cy="172" r="11" fill="none" stroke="#16a34a" stroke-width="1"/>
  <path d="M579,154 A26,26 0 0 1 586,170" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="560" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(560.0000457763672 0) scale(0.6599772504347969 1) translate(-560.0000457763672 0)" data-ru-fit="0.6600">хвостовое кольцо, <tspan font-style="italic">M</tspan><tspan font-size="14" dy="3">tail</tspan></text>
  <text x="560" y="232" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(560.0000762939453 0) scale(0.5446374254588413 1) translate(-560.0000762939453 0)" data-ru-fit="0.5446">перезаписывает самые старые</text>

  <!-- stream segments drop into their buffers -->
  <path d="M235,96 V158" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#arr-green)"/>
  <path d="M400,96 V156" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
  <path d="M560,96 V146" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#arr-green)"/>

  </g>

  <g transform="translate(34,0)">
  <!-- ===== Staged observation ===== -->
  <text x="720" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(720.0000457763672 0) scale(0.785772010797284 1) translate(-720.0000457763672 0)" data-ru-fit="0.7858">Поэтапное наблюдение</text>
  <rect x="640" y="60" width="160" height="26" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="720" y="78" text-anchor="middle" font-size="14" fill="#334155">статус</text>
  <rect x="640" y="90" width="160" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="720" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">голова</text>
  <rect x="640" y="120" width="160" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="720" y="138" text-anchor="middle" font-size="14" fill="#334155">: байты опущены</text>
  <rect x="640" y="150" width="160" height="26" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="720" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">хвост</text>
  <rect x="640" y="180" width="160" height="26" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="720" y="198" text-anchor="middle" font-size="14" fill="#334155">ручка</text>
  <text x="720" y="228" text-anchor="middle" font-size="14" fill="#0f172a" transform=" translate(720.0000610351562 0) scale(0.788900751649026 1) translate(-720.0000610351562 0)" data-ru-fit="0.7889"><tspan font-style="italic">M</tspan><tspan dy="3">набл.,макс.</tspan><tspan dy="-3" dx="4">=</tspan></text>
  <text x="720" y="248" text-anchor="middle" font-size="14" fill="#0f172a" transform=" translate(720 0) scale(0.6603442388516472 1) translate(-720 0)" data-ru-fit="0.6603"><tspan font-style="italic">M</tspan><tspan dy="3">голова</tspan><tspan dy="-3" dx="4">+</tspan><tspan dx="4" font-style="italic">M</tspan><tspan dy="3">уведомление</tspan><tspan dy="-3" dx="4">+</tspan><tspan dx="4" font-style="italic">M</tspan><tspan dy="3">хвост</tspan></text>


  <!-- next model call -->
  <rect x="650" y="290" width="140" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="720" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(720.0000534057617 0) scale(0.7058974149880255 1) translate(-720.0000534057617 0)" data-ru-fit="0.7059">Следующий вызов модели</text>
  <text x="720" y="329" text-anchor="middle" font-size="14" fill="#0369a1" transform=" translate(720.0000152587891 0) scale(0.9120026247248456 1) translate(-720.0000152587891 0)" data-ru-fit="0.9120">измеряется в токенах</text>
  <path d="M720,258 V288" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- bracket: head, notice, tail serialize together -->
    <path d="M638,92 H628 V174 H638" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  </g>

  <!-- readiness loop feeds the stream -->
  <path d="M180,209 H203 V78 H224" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <!-- buffers serialize into the observation -->
  <path d="M646,160 H660" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- retained record serves range reads -->
  <path d="M180,318 H657 V193 H672" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="426" y="310" text-anchor="middle" font-size="14" fill="#6d28d9" transform=" translate(426 0) scale(0.5420496066066016 1) translate(-426 0)" data-ru-fit="0.5420">диапазон считывается по дескриптору</text>
