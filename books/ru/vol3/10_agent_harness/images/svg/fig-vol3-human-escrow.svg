<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <g transform="translate(0,4)">
  <defs>
    <style>
      .panel { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .field { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .val { font-size: 12.5px; fill: #475569; }
      .name { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 12.5px; fill: #475569; text-anchor: middle; }
      .edge { font-size: 12.5px; fill: #334155; }
      .code { font-size: 12.5px; fill: #b45309; }
    </style>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ================= (a) The approval record ================= -->
  <text x="20" y="28" class="panel">(a) Что одобряет рецензент</text>

  <!-- exact proposal -->
  <rect x="20" y="44" width="720" height="52" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="36" y="65" class="field">Точное предложение</text>
  <text x="36" y="85" class="code" font-family="Courier New, monospace">submit_review(r18 patch, named check records)</text>

  <!-- field cells -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
    <rect x="20" y="96" width="144" height="56" rx="0"/>
    <rect x="164" y="96" width="144" height="56" rx="0"/>
    <rect x="308" y="96" width="144" height="56" rx="0"/>
    <rect x="452" y="96" width="144" height="56" rx="0"/>
    <rect x="596" y="96" width="144" height="56" rx="0"/>
  </g>
  <text x="32" y="118" class="field">Пункт назначения</text>
  <text x="32" y="138" class="val" transform=" translate(32 0) scale(0.7581747644559395 1) translate(-32 0)" data-ru-fit="0.7582">внутренний, область данных</text>
  <text x="176" y="118" class="field">Доказательства</text>
  <text x="176" y="138" class="val" transform=" translate(176 0) scale(0.7009992313604919 1) translate(-176 0)" data-ru-fit="0.7010">только именованные проверки</text>
  <text x="320" y="118" class="field" transform=" translate(320 0) scale(0.7339186525712238 1) translate(-320 0)" data-ru-fit="0.7339">Предварительные условия</text>
  <text x="320" y="138" class="val">базовая версия</text>
  <text x="464" y="118" class="field">Срок действия</text>
  <text x="464" y="138" class="val" transform=" translate(464 0) scale(0.5764449750684739 1) translate(-464 0)" data-ru-fit="0.5764">записано как срок действия истекает</text>
  <text x="608" y="118" class="field">Траектория</text>
  <text x="608" y="138" class="val">запрос задачи</text>

  <!-- binding ticks: every field feeds the digest -->
  <g stroke="#7c3aed" stroke-width="1.2">
    <line x1="92" y1="152" x2="92" y2="170"/>
    <line x1="236" y1="152" x2="236" y2="170"/>
    <line x1="380" y1="152" x2="380" y2="170"/>
    <line x1="524" y1="152" x2="524" y2="170"/>
    <line x1="668" y1="152" x2="668" y2="170"/>
  </g>
  <rect x="20" y="170" width="720" height="32" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="191" class="name" fill="#6d28d9">Дайджест утверждения: связывает предложение и каждое поле.</text>

  <line x1="20" y1="218" x2="740" y2="218" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ================= (b) The gate ================= -->
  <text x="20" y="242" class="panel">(б) Врата</text>

  <!-- steps -->
  <rect x="20" y="290" width="170" height="50" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="105" y="311" class="name" fill="#0f172a">1 Удерживать</text>
  <text x="105" y="328" class="sub" style="fill:#b45309">AWAITING_APPROVAL</text>

  <rect x="210" y="290" width="110" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="265" y="311" class="name" fill="#0f172a">2 Рецензент</text>
  <text x="265" y="328" class="sub">видит только (а)</text>

  <rect x="340" y="290" width="130" height="50" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="405" y="311" class="name" fill="#0f172a">3 Решение</text>
  <text x="405" y="328" class="sub" transform=" translate(405 0) scale(0.7874648453194054 1) translate(-405 0)" data-ru-fit="0.7875">модель не запрашивалась</text>

  <line x1="190" y1="315" x2="208" y2="315" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <line x1="320" y1="315" x2="338" y2="315" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- dispatch boundary: a wall with one opening -->
  <rect x="510" y="270" width="8" height="35" rx="0" fill="#7c3aed"/>
  <rect x="510" y="325" width="8" height="125" rx="0" fill="#7c3aed"/>
  <text x="514" y="472" class="name" fill="#6d28d9" transform=" translate(514 0) scale(0.7186860527732902 1) translate(-514 0)" data-ru-fit="0.7187">4 Повторно проверьте</text>
  <text x="514" y="489" class="name" fill="#6d28d9">граница отправки</text>

  <!-- approved and current: the only path through -->
  <line x1="470" y1="315" x2="588" y2="315" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <text x="554" y="288" class="edge" text-anchor="middle" transform=" translate(554 0) scale(0.9314786192684184 1) translate(-554 0)" data-ru-fit="0.9315">одобрено,</text>
  <text x="554" y="303" class="edge" text-anchor="middle">ток</text>
  <rect x="590" y="290" width="150" height="50" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="665" y="311" class="name" fill="#b45309">WAITING_TOOL</text>
  <text x="665" y="328" class="sub" transform=" translate(665 0) scale(0.7949790794979079 1) translate(-665 0)" data-ru-fit="0.7950">зарезервировано, отправлено</text>

  <!-- approved, no capacity: stays held -->
  <polyline points="514,270 514,262 105,262 105,288" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="310" y="280" class="edge" text-anchor="middle" transform=" translate(310 0) scale(0.71239591330538 1) translate(-310 0)" data-ru-fit="0.7124">одобрено, нет вместимости: остается в силе</text>

  <!-- refusals -->
  <line x1="405" y1="340" x2="405" y2="398" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="397" y="366" class="edge" text-anchor="end" transform=" translate(397 0) scale(0.7280461031833151 1) translate(-397 0)" data-ru-fit="0.7280">отказано,</text>
  <text x="397" y="381" class="edge" text-anchor="end">истек</text>
  <line x1="510" y1="423" x2="472" y2="423" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="490" y="413" class="edge" text-anchor="middle" transform=" translate(490 0) scale(0.490418118466899 1) translate(-490 0)" data-ru-fit="0.4904">устарело</text>
  <rect x="340" y="400" width="130" height="50" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="405" y="421" class="name" fill="#334155">REFUSED</text>
  <text x="405" y="438" class="sub">обратно в READY</text>
  </g>
<metadata id="original-source-labels">(a) What the reviewer approves
Exact proposal
submit_review(r18 patch, named check records)
Destination
internal, data scoped
Evidence
named checks only
Preconditions
base version
Expiry
recorded as expiry
Trajectory
requesting task
Approval digest: binds the proposal and every field
(b) The gate
1  Hold
AWAITING_APPROVAL
2  Reviewer
sees (a) only
3  Decision
model not asked
4  Recheck at the
dispatch boundary
approved,
current
WAITING_TOOL
reserved, sent
approved, no capacity: stays held
denied,
expired
stale
REFUSED
back to READY</metadata></svg>