<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="720" height="435" fill="#ffffff"/>

  <!-- ===== Task sandbox (one per trial) ===== -->
  <rect x="20" y="20" width="300" height="370" rx="4" fill="#fffdf7" stroke="#d97706" stroke-width="1.5"/>
  <path d="M20,44 V24 Q20,20 24,20 H316 Q320,20 320,24 V44 Z" fill="#fef3c7"/>
  <line x1="20" y1="44" x2="320" y2="44" stroke="#d97706" stroke-width="0.8"/>
  <text x="34" y="37" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(34 0) scale(0.835704685544793 1) translate(-34 0)" data-ru-fit="0.8357">Песочница задач, по одной на пробную версию.</text>

  <!-- Agent under test -->
  <rect x="60" y="64" width="240" height="50" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Агент тестируется.</text>
  <text x="180" y="103" text-anchor="middle" font-size="12" fill="#475569" font-family="Menlo, Courier New, monospace">candidate_v2</text>

  <line x1="180" y1="114" x2="180" y2="148" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="190" y="136" font-size="12" fill="#475569" transform=" translate(190 0) scale(0.6728723404255319 1) translate(-190 0)" data-ru-fit="0.6729">редактирует, проводит проверки</text>

  <!-- Fixture: per-trial copy-on-write layer over a shared read-only base -->
  <rect x="52" y="142" width="256" height="110" rx="3" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="236" y="267" text-anchor="end" font-size="12" fill="#b45309" transform=" translate(236 0) scale(0.7798981221014217 1) translate(-236 0)" data-ru-fit="0.7799">приспособление <tspan font-family="Menlo, Courier New, monospace">pool_fixture_v1</tspan></text>
  <rect x="60" y="150" width="240" height="44" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Слой копирования при записи</text>
  <text x="180" y="185" text-anchor="middle" font-size="12" fill="#475569">пишет этот суд</text>
  <rect x="60" y="194" width="240" height="50" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Базовое изображение</text>
  <text x="180" y="233" text-anchor="middle" font-size="12" fill="#475569">только для чтения, общий доступ</text>

  <!-- Service fixtures -->
  <path d="M60,100 H40 V315 H58" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="48" y="272" font-size="12" fill="#475569">звонки</text>
  <rect x="60" y="290" width="150" height="50" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="135" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(135 0) scale(0.7690615215367691 1) translate(-135 0)" data-ru-fit="0.7691">Сервисные приспособления</text>
  <text x="135" y="329" text-anchor="middle" font-size="12" fill="#475569">эмуляторы, ответы</text>

  <!-- Egress: stopped at the sandbox wall -->
  <line x1="250" y1="244" x2="250" y2="384" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="234" y1="390" x2="266" y2="390" stroke="#dc2626" stroke-width="4"/>
  <text x="250" y="411" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" transform=" translate(250 0) scale(0.7565426997245179 1) translate(-250 0)" data-ru-fit="0.7565">внешний выход заблокирован</text>

  <!-- ===== Grading boundary ===== -->
  <rect x="400" y="20" width="300" height="370" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M400,44 V24 Q400,20 404,20 H696 Q700,20 700,24 V44 Z" fill="#e2e8f0"/>
  <line x1="400" y1="44" x2="700" y2="44" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="414" y="37" font-size="14" font-weight="700" fill="#0f172a">Граница оценки</text>

  <!-- Trusted controller -->
  <rect x="415" y="64" width="250" height="110" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Доверенный контроллер</text>
  <rect x="424" y="98" width="98" height="26" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="473" y="115" text-anchor="middle" font-size="12" fill="#0f172a" transform=" translate(473 0) scale(0.839677047289504 1) translate(-473 0)" data-ru-fit="0.8397">Отложенные тесты</text>
  <rect x="530" y="98" width="60" height="26" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="560" y="115" text-anchor="middle" font-size="12" fill="#0f172a" transform=" translate(560 0) scale(0.9702517162471396 1) translate(-560 0)" data-ru-fit="0.9703">Критерии</text>
  <text x="560" y="142" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-family="Menlo, Courier New, monospace">repair_accept_v1</text>
  <rect x="598" y="98" width="58" height="26" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="627" y="115" text-anchor="middle" font-size="12" fill="#0f172a" transform=" translate(627 0) scale(0.7784402575721441 1) translate(-627 0)" data-ru-fit="0.7784">Результаты</text>
  <text x="540" y="164" text-anchor="middle" font-size="12" font-style="italic" fill="#6d28d9">вне досягаемости кандидата</text>

  <!-- Narrow interface -->
  <line x1="480" y1="174" x2="480" y2="218" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="488" y="192" font-size="12" fill="#475569">выбрано</text>
  <text x="488" y="207" font-size="12" fill="#475569">тесты</text>
  <line x1="610" y1="220" x2="610" y2="176" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-gray)"/>
  <text x="602" y="192" text-anchor="end" font-size="12" fill="#475569" transform=" translate(602 0) scale(0.9144736842105263 1) translate(-602 0)" data-ru-fit="0.9145">ненадежный</text>
  <text x="602" y="207" text-anchor="end" font-size="12" fill="#475569">вывод</text>

  <!-- Candidate execution: the attack surface -->
  <rect x="415" y="220" width="250" height="70" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Казнь кандидата</text>
  <text x="540" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">ограниченная, поверхность атаки</text>

  <!-- Verdicts bound to the artifact -->
  <path d="M665,115 H684 V346 H667" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="415" y="320" width="250" height="52" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Вердикты, связанные с <tspan font-family="Menlo, Courier New, monospace">ws_r19</tspan></text>
  <text x="540" y="360" text-anchor="middle" font-size="12" fill="#475569" transform=" translate(540 0) scale(0.894770151314654 1) translate(-540 0)" data-ru-fit="0.8948">пройдено, не пройдено, ожидается, неизвестно</text>
  <!-- ===== Captured artifact crosses the boundary ===== -->
  <path d="M300,172 H360 V255 H414" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="324" y="202" width="72" height="24" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Menlo, Courier New, monospace">ws_r19</text>

