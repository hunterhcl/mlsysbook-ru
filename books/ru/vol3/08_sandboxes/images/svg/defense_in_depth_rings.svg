<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="700" height="270" fill="#ffffff"/>

  <!-- ===== Column headers ===== -->
  <g text-anchor="middle">
    <text x="85" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(85.00000476837158 0) scale(0.5857143105060524 1) translate(-85.00000476837158 0)" data-ru-fit="0.5857">Модельное предложение</text>
    <text x="85" y="57" font-size="11" font-style="italic" fill="#475569" transform=" translate(85.18686103820801 0) scale(0.701296563550093 1) translate(-85.18686103820801 0)" data-ru-fit="0.7013">под руководством README</text>
    <text x="235" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(234.99996948242188 0) scale(0.5686755432258337 1) translate(-234.99996948242188 0)" data-ru-fit="0.5687">Посредничество</text>
    <text x="235" y="57" font-size="11" fill="#475569" transform=" translate(234.99997329711914 0) scale(0.7074487526866129 1) translate(-234.99997329711914 0)" data-ru-fit="0.7074">прием инструмента</text>
    <text x="365" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Конверт казни</text>
    <text x="365" y="57" font-size="11" fill="#475569" transform=" translate(364.99999237060547 0) scale(0.5426281178592122 1) translate(-364.99999237060547 0)" data-ru-fit="0.5426">политика файловой системы</text>
    <text x="495" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Выход</text>
    <text x="495" y="57" font-size="11" fill="#475569" transform=" translate(494.9999694824219 0) scale(0.7820343488412199 1) translate(-494.9999694824219 0)" data-ru-fit="0.7820">политика назначения</text>
    <text x="615" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(614.9999465942383 0) scale(0.8216463707954623 1) translate(-614.9999465942383 0)" data-ru-fit="0.8216">Вне среды исполнения</text>
    <text x="615" y="57" font-size="11" font-style="italic" fill="#475569" transform=" translate(614.9889678955078 0) scale(0.49366965178179056 1) translate(-614.9889678955078 0)" data-ru-fit="0.4937">эффект или раскрытие информации</text>
  </g>

  <!-- ===== Boundaries as walls; a gap is a passed check ===== -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1">
    <!-- Mediation: both requests admitted -->
    <rect x="230" y="80" width="10" height="30" rx="1"/>
    <rect x="230" y="130" width="10" height="70" rx="1"/>
    <rect x="230" y="220" width="10" height="30" rx="1"/>
    <!-- Execution envelope: lane 1 blocked, lane 2 open -->
    <rect x="360" y="80" width="10" height="120" rx="1"/>
    <rect x="360" y="220" width="10" height="30" rx="1"/>
    <!-- Egress: lane 1 would be blocked, lane 2 open -->
    <rect x="490" y="80" width="10" height="120" rx="1"/>
    <rect x="490" y="220" width="10" height="30" rx="1"/>
  </g>
  <rect x="359" y="104" width="12" height="32" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <rect x="489" y="104" width="12" height="32" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ===== Lane 1: injected run_shell ===== -->
  <rect x="20" y="94" width="130" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="85" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1" transform=" translate(85.0000057220459 0) scale(0.9833494549828263 1) translate(-85.0000057220459 0)" data-ru-fit="0.9833">Внедренный запрос</text>
  <text x="85" y="134" text-anchor="middle" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">run_shell</text>
  <path d="M 150 120 H 359" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 371 120 H 489" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="246" y="137" font-size="11" fill="#475569" transform=" translate(246 0) scale(0.8410689413325639 1) translate(-246 0)" data-ru-fit="0.8411">допущено</text>
  <text x="352" y="111" text-anchor="end" font-size="11" font-weight="700" fill="#b91c1c" transform=" translate(351.9999771118164 0) scale(0.6125315470478653 1) translate(-351.9999771118164 0)" data-ru-fit="0.6125">чтение запрещено</text>
  <text x="482" y="111" text-anchor="end" font-size="11" fill="#b91c1c" transform=" translate(481.99996185302734 0) scale(0.6660905360567485 1) translate(-481.99996185302734 0)" data-ru-fit="0.6661">загрузка запрещена</text>
  <rect x="550" y="96" width="130" height="48" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="615" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">Диагностика</text>
  <text x="615" y="133" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">не достигнуто</text>

  <!-- ===== Lane 2: permitted submit_report ===== -->
  <rect x="20" y="184" width="130" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="85" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1" transform=" translate(85.0000057220459 0) scale(0.9734166352039164 1) translate(-85.0000057220459 0)" data-ru-fit="0.9734">Разрешенный канал</text>
  <text x="85" y="224" text-anchor="middle" font-size="11.5" fill="#0f172a" font-family="Courier New, monospace">submit_report</text>
  <path d="M 150 210 H 548" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="246" y="227" font-size="11" fill="#475569" transform=" translate(246 0) scale(0.8410689413325639 1) translate(-246 0)" data-ru-fit="0.8411">допущено</text>
  <text x="376" y="227" font-size="11" fill="#475569" transform=" translate(376 0) scale(0.6579954372888942 1) translate(-376 0)" data-ru-fit="0.6580">чтение разрешено</text>
  <text x="506" y="227" font-size="11" fill="#475569" transform=" translate(506 0) scale(0.347826091076224 1) translate(-506 0)" data-ru-fit="0.3478">отправлено</text>
  <rect x="550" y="186" width="130" height="48" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(614.9687652587891 0) scale(0.9128342134116065 1) translate(-614.9687652587891 0)" data-ru-fit="0.9128">Утвержденная услуга</text>
  <text x="615" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">раскрытие</text>
