<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 324" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="700" height="324" fill="#ffffff"/>

  <!-- ===== Column headers ===== -->
  <g text-anchor="middle">
    <text x="98" y="40" font-size="12.5" font-weight="700" fill="#0f172a">Гость</text>
    <text x="98" y="57" font-size="11" font-style="italic" fill="#475569" transform=" translate(97.97800636291504 0) scale(0.5257129721403642 1) translate(-97.97800636291504 0)" data-ru-fit="0.5257">нет маршрута по умолчанию</text>
    <text x="280" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(280.0000190734863 0) scale(0.7170289716922011 1) translate(-280.0000190734863 0)" data-ru-fit="0.7170">Фильтр пакетов</text>
    <text x="280" y="57" font-size="11" fill="#475569">адреса, порты</text>
    <text x="440" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(440.04008865356445 0) scale(0.7779323152524488 1) translate(-440.04008865356445 0)" data-ru-fit="0.7779">Посредник</text>
    <text x="440" y="57" font-size="11" fill="#475569">имя, операция, поля</text>
    <text x="610" y="40" font-size="12.5" font-weight="700" fill="#0f172a" transform=" translate(609.9999923706055 0) scale(0.8468521294272625 1) translate(-609.9999923706055 0)" data-ru-fit="0.8469">За пределами гостя</text>
  </g>

  <!-- ===== Guest region ===== -->
  <rect x="20" y="76" width="156" height="228" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <g fill="#fef3c7" stroke="#d97706" stroke-width="1.2">
    <rect x="28" y="92" width="140" height="32" rx="3"/>
    <rect x="28" y="148" width="140" height="32" rx="3"/>
    <rect x="28" y="204" width="140" height="32" rx="3"/>
    <rect x="28" y="260" width="140" height="32" rx="3"/>
  </g>
  <g font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">
    <text x="98" y="112" transform=" translate(97.99999141693115 0) scale(0.619744578171219 1) translate(-97.99999141693115 0)" data-ru-fit="0.6197">Получить одобренный репозиторий</text>
    <text x="98" y="168" transform=" translate(97.99998950958252 0) scale(0.744781887755211 1) translate(-97.99998950958252 0)" data-ru-fit="0.7448">Push или другой репозиторий</text>
    <text x="98" y="224">Прямой разъем</text>
    <text x="98" y="280">Поиск имени</text>
  </g>

  <!-- ===== Packet filter wall: open for traffic to the mediator ===== -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1">
    <rect x="275" y="76" width="10" height="22" rx="1"/>
    <rect x="275" y="118" width="10" height="36" rx="1"/>
    <rect x="275" y="174" width="10" height="130" rx="1"/>
  </g>
  <rect x="274" y="204" width="12" height="32" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <rect x="274" y="260" width="12" height="32" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>

  <!-- ===== Mediator wall: opens only for the granted operation ===== -->
  <g fill="#f3e8ff" stroke="#7c3aed" stroke-width="1">
    <rect x="435" y="76" width="10" height="22" rx="1"/>
    <rect x="435" y="118" width="10" height="186" rx="1"/>
  </g>
  <rect x="434" y="148" width="12" height="32" rx="1" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>

  <!-- ===== Request paths ===== -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M 168 108 H 538" stroke="#334155" marker-end="url(#arr-gray)"/>
    <path d="M 168 164 H 434"/>
    <path d="M 168 220 H 274"/>
    <path d="M 168 276 H 274"/>
  </g>

  <!-- decisions at each wall -->
  <g font-size="11" fill="#475569">
    <text x="291" y="125" transform=" translate(291 0) scale(0.9274580590278978 1) translate(-291 0)" data-ru-fit="0.9275">посреднику</text>
    <text x="291" y="181" transform=" translate(291 0) scale(0.9274580590278978 1) translate(-291 0)" data-ru-fit="0.9275">посреднику</text>
    <text x="451" y="125" transform=" translate(451.0000305175781 0) scale(0.9923857849151774 1) translate(-451.0000305175781 0)" data-ru-fit="0.9924">выбор принят</text>
  </g>
  <text x="451" y="99" font-size="11" font-weight="700" fill="#6d28d9" transform=" translate(451.0000305175781 0) scale(0.6236677720989706 1) translate(-451.0000305175781 0)" data-ru-fit="0.6237">+ учетные данные</text>
  <g font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">
    <text x="429" y="156" transform=" translate(429.00000762939453 0) scale(0.7880452090219302 1) translate(-429.00000762939453 0)" data-ru-fit="0.7880">операция отклонена</text>
    <text x="269" y="212">упал</text>
    <text x="269" y="268" transform=" translate(269.00000762939453 0) scale(0.6228673526002962 1) translate(-269.00000762939453 0)" data-ru-fit="0.6229">нет маршрута резольвера</text>
  </g>

  <!-- ===== Destinations ===== -->
  <rect x="540" y="90" width="140" height="36" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" transform=" translate(609.9700012207031 0) scale(0.779611629185561 1) translate(-609.9700012207031 0)" data-ru-fit="0.7796">Утвержденный репозиторий</text>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3">
    <rect x="540" y="200" width="140" height="40" rx="3"/>
    <rect x="540" y="256" width="140" height="40" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#64748b">
    <text x="610" y="216" font-size="12" font-weight="700">Хост метаданных</text>
    <text x="610" y="231" font-size="11" font-style="italic">не достигнуто</text>
    <text x="610" y="272" font-size="12" font-weight="700">Внешний сервер DNS</text>
    <text x="610" y="287" font-size="11" font-style="italic">не достигнуто</text>
  </g>
