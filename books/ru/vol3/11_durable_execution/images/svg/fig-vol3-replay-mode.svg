<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- =================== Live execution =================== -->
  <text x="40" y="34" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(39.91608428955078 0) scale(0.7167002771574524 1) translate(-39.91608428955078 0)" data-ru-fit="0.7167">Живое исполнение</text>

  <!-- Turn loop: result returns to the harness around the top -->
  <path d="M 635 70 V 54 H 125 V 68" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="380" y="48" font-size="12" fill="#475569" text-anchor="middle" transform=" translate(380 0) scale(0.5367156479658803 1) translate(-380 0)" data-ru-fit="0.5367">следующий ход</text>

  <!-- Pipeline -->
  <rect x="65" y="70" width="120" height="52" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="125" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Обвязка</text>
  <text x="125" y="110" font-size="12" fill="#475569" text-anchor="middle">запись</text>

  <rect x="235" y="70" width="120" height="52" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="295" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Модель</text>
  <text x="295" y="110" font-size="12" fill="#0369a1" text-anchor="middle">выбрано</text>

  <rect x="405" y="70" width="120" height="52" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="465" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform=" translate(464.9999694824219 0) scale(0.8396470299378803 1) translate(-464.9999694824219 0)" data-ru-fit="0.8396">Ворота авторизации</text>
  <text x="465" y="110" font-size="12" fill="#475569" text-anchor="middle">авторизовать</text>

  <rect x="575" y="70" width="120" height="52" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="635" y="92" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Инструменты</text>
  <text x="635" y="110" font-size="12" fill="#b45309" text-anchor="middle">реальные эффекты</text>

  <line x1="185" y1="96" x2="233" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="355" y1="96" x2="403" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="525" y1="96" x2="573" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Every step appends to the log (downward) -->
  <g stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)">
    <line x1="125" y1="122" x2="125" y2="158"/>
    <line x1="295" y1="122" x2="295" y2="158"/>
    <line x1="425" y1="122" x2="425" y2="158"/>
    <line x1="505" y1="122" x2="505" y2="158"/>
    <line x1="635" y1="122" x2="635" y2="158"/>
  </g>

  <!-- Log tape -->
  <rect x="40" y="160" width="680" height="36" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <g stroke="#7c3aed" stroke-width="1">
    <line x1="210" y1="160" x2="210" y2="196"/>
    <line x1="380" y1="160" x2="380" y2="196"/>
    <line x1="465" y1="160" x2="465" y2="196"/>
    <line x1="550" y1="160" x2="550" y2="196"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">
    <text x="125" y="182">КонтекстВстроенный</text>
    <text x="295" y="182">МодельОтветил</text>
    <text x="422" y="182">Авторизовано</text>
    <text x="507" y="182">ToolIntent</text>
    <text x="635" y="182">Результат инструмента</text>
  </g>
  <text x="40" y="216" font-size="12" fill="#6d28d9" transform=" translate(40 0) scale(0.7715558277972915 1) translate(-40 0)" data-ru-fit="0.7716">Журнал траектории: добавлен каждый шаг.</text>

  <!-- Panel divider -->
  <line x1="20" y1="236" x2="740" y2="236" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- =================== Replay =================== -->
  <text x="40" y="264" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(40 0) scale(0.8945715890144221 1) translate(-40 0)" data-ru-fit="0.8946">Повтор</text>

  <rect x="65" y="300" width="120" height="52" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="125" y="322" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Обвязка</text>
  <text x="125" y="340" font-size="12" fill="#475569" text-anchor="middle">переигрываю</text>

  <rect x="235" y="300" width="120" height="52" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="295" y="322" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">Модель</text>
  <text x="295" y="340" font-size="12" fill="#64748b" text-anchor="middle">заглушено</text>

  <rect x="405" y="300" width="120" height="52" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="465" y="322" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform=" translate(464.9999694824219 0) scale(0.8396470299378803 1) translate(-464.9999694824219 0)" data-ru-fit="0.8396">Ворота авторизации</text>
  <text x="465" y="340" font-size="12" fill="#475569" text-anchor="middle">авторизовать</text>

  <rect x="575" y="300" width="120" height="52" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="635" y="322" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">Инструменты</text>
  <text x="635" y="340" font-size="12" fill="#64748b" text-anchor="middle">отключен</text>

  <!-- Inert wiring to the stub -->
  <line x1="185" y1="326" x2="233" y2="326" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="355" y1="326" x2="403" y2="326" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <!-- Dispatch is cut: an unlogged request stops the replay -->
  <line x1="525" y1="326" x2="546" y2="326" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="548" y1="314" x2="548" y2="338" stroke="#dc2626" stroke-width="2.5"/>
  <text x="550" y="290" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" transform=" translate(550.0000457763672 0) scale(0.6005400607002804 1) translate(-550.0000457763672 0)" data-ru-fit="0.6005">незарегистрированный запрос: стоп</text>

  <!-- Recorded events stream up into the harness -->
  <g stroke="#7c3aed" stroke-width="1.2" fill="none">
    <line x1="295" y1="388" x2="295" y2="372"/>
    <line x1="425" y1="388" x2="425" y2="372"/>
    <line x1="505" y1="388" x2="505" y2="372"/>
    <line x1="635" y1="388" x2="635" y2="372"/>
    <path d="M 635 372 H 125"/>
  </g>
  <line x1="125" y1="388" x2="125" y2="354" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <rect x="40" y="390" width="680" height="36" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <g stroke="#7c3aed" stroke-width="1">
    <line x1="210" y1="390" x2="210" y2="426"/>
    <line x1="380" y1="390" x2="380" y2="426"/>
    <line x1="465" y1="390" x2="465" y2="426"/>
    <line x1="550" y1="390" x2="550" y2="426"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">
    <text x="125" y="412">КонтекстВстроенный</text>
    <text x="295" y="412">МодельОтветил</text>
    <text x="422" y="412">Авторизовано</text>
    <text x="507" y="412">ToolIntent</text>
    <text x="635" y="412">Результат инструмента</text>
  </g>
  <text x="40" y="446" font-size="12" fill="#6d28d9" transform=" translate(40 0) scale(0.8046373550427265 1) translate(-40 0)" data-ru-fit="0.8046">Журнал траектории: записанные события поступают в обвязку по порядку</text>
