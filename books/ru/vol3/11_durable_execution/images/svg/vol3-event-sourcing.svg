<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== Runtime memory (volatile: dashed boundary) ===== -->
  <rect x="20" y="20" width="720" height="170" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="36" y="44" font-size="13" font-weight="700" fill="#334155">Память среды исполнения: теряется при сбое</text>

  <!-- Initial record R0 -->
  <rect x="40" y="60" width="180" height="110" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 40 86 V 63 Q 40 60 43 60 H 217 Q 220 60 220 63 V 86 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="130" y="78" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Начальная запись <tspan font-style="italic">R</tspan><tspan font-size="12" dy="3">0</tspan></text>
  <rect x="52" y="102" width="156" height="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="130" y="117" font-size="12" fill="#334155" text-anchor="middle">задача, гранты, лимиты</text>
  <rect x="52" y="130" width="156" height="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="130" y="145" font-size="12" fill="#334155" text-anchor="middle" transform=" translate(129.99999237060547 0) scale(0.9509069131614926 1) translate(-129.99999237060547 0)" data-ru-fit="0.9509">нет разрешенных операций</text>

  <!-- Deterministic reducer -->
  <rect x="290" y="60" width="180" height="110" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 290 86 V 63 Q 290 60 293 60 H 467 Q 470 60 470 63 V 86 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="380" y="78" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform=" translate(380.00000762939453 0) scale(0.8606130791781099 1) translate(-380.00000762939453 0)" data-ru-fit="0.8606">Детерминированный редуктор</text>
  <text x="380" y="120" font-size="13" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">применить(R, e)</text>
  <text x="380" y="146" font-size="12" fill="#334155" text-anchor="middle" transform=" translate(380.00000762939453 0) scale(0.8318437673410719 1) translate(-380.00000762939453 0)" data-ru-fit="0.8318">нет вызова модели или инструмента</text>

  <!-- Reconstructed record Rj -->
  <rect x="540" y="60" width="180" height="110" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <path d="M 540 86 V 63 Q 540 60 543 60 H 717 Q 720 60 720 63 V 86 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="630" y="78" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Реконструировано <tspan font-style="italic">R</tspan><tspan font-size="12" dy="3">j</tspan></text>
  <rect x="552" y="94" width="156" height="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="630" y="108" font-size="12" fill="#334155" text-anchor="middle">прием состоялся</text>
  <rect x="552" y="118" width="156" height="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="630" y="132" font-size="12" fill="#334155" text-anchor="middle">бронирование сохранено</text>
  <rect x="552" y="142" width="156" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="630" y="156" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle"><tspan font-family="Courier New, monospace">test_r18</tspan> нерешённый</text>

  <!-- Record flow -->
  <line x1="220" y1="115" x2="288" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="470" y1="115" x2="538" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ===== Fold from the log ===== -->
  <line x1="380" y1="220" x2="380" y2="172" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="392" y="210" font-size="12" fill="#6d28d9" transform=" translate(392 0) scale(0.44617247294466866 1) translate(-392 0)" data-ru-fit="0.4462">сгиб, в логарифмическом порядке</text>


  <!-- ===== Trajectory log (durable: solid boundary) ===== -->
  <rect x="20" y="220" width="720" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="36" y="244" font-size="13" font-weight="700" fill="#334155">Журнал траектории: долговременный, только для добавления.</text>

  <!-- Index labels -->
  <g font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">
    <text x="95" y="268"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">1</tspan></text>
    <text x="205" y="268"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">2</tspan></text>
    <text x="315" y="268"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">3</tspan></text>
    <text x="425" y="268"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">4</tspan></text>
    <text x="535" y="268"><tspan font-style="italic">e</tspan><tspan font-size="12" dy="3">j</tspan></text>
  </g>

  <!-- Tape cells (contiguous, square-cornered: an ordered sequence) -->
  <rect x="40" y="276" width="550" height="48" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <g stroke="#7c3aed" stroke-width="1">
    <line x1="150" y1="276" x2="150" y2="324"/>
    <line x1="260" y1="276" x2="260" y2="324"/>
    <line x1="370" y1="276" x2="370" y2="324"/>
    <line x1="480" y1="276" x2="480" y2="324"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle" font-family="Courier New, monospace">
    <text x="95" y="304" transform=" translate(95.0000114440918 0) scale(0.9609324992607902 1) translate(-95.0000114440918 0)" data-ru-fit="0.9609">Задача запущена</text>
    <text x="205" y="304" transform=" translate(204.99996948242188 0) scale(0.983816868649412 1) translate(-204.99996948242188 0)" data-ru-fit="0.9838">КонтекстВстроенный</text>
    <text x="315" y="304">МодельОтветил</text>
    <text x="425" y="297">Авторизовано</text>
    <text x="425" y="313">Бюджет зарезервирован</text>
    <text x="535" y="297">ToolIntent</text>
    <text x="535" y="313">test_r18</text>
  </g>

  <!-- Boundary j -->
  <line x1="602" y1="258" x2="602" y2="336" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="612" y="268" font-size="13" font-weight="700" fill="#6d28d9">граница <tspan font-style="italic">j</tspan></text>

  <!-- Unrecorded result -->
  <rect x="614" y="276" width="104" height="48" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="666" y="297" font-size="12" fill="#64748b" text-anchor="middle" font-family="Courier New, monospace" transform=" translate(665.9999694824219 0) scale(0.6466535060175395 1) translate(-665.9999694824219 0)" data-ru-fit="0.6467">Результат инструмента</text>
  <text x="666" y="313" font-size="12" fill="#64748b" text-anchor="middle">не записано</text>

  <!-- Absence propagates: no recorded result, so the record marks the test unresolved -->
  <line x1="704" y1="276" x2="704" y2="170" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,3"/>
