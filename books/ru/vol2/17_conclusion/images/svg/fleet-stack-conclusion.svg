<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14294E"/>
    </marker>
  </defs>
  <rect width="680" height="392" fill="#ffffff"/>
  <g transform="translate(18,8)">

  <!-- Each principle owns a territory on the stack: a band, a row, or (Governance) a split by obligation. -->

  <!-- ===== Part IV: Governance band (y 16-90) ===== -->
  <rect x="40" y="16" width="98" height="74" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89" y="49" text-anchor="middle" font-size="12" fill="#475569">Часть IV</text>
  <text x="89" y="65" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">Управление</text>
  <line x1="138" y1="53" x2="150" y2="53" stroke="#1F407A" stroke-width="1"/>
  <!-- Responsibility territory: the Assurance row plus the governance half of the top row -->
  <path d="M150,16 H250 V56 H370 V90 H150 Z" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="150" y1="53" x2="250" y2="53" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="162" y="37.5" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(161.9375 0) scale(0.9728592467915002 1) translate(-161.9375 0)" data-ru-fit="0.9729">Управление</text>
  <text x="162" y="77" font-size="12.5" font-weight="700" fill="#14294E">Гарантия</text>
  <!-- Sustainability territory: the resource half of the top row -->
  <rect x="256" y="16" width="114" height="34" rx="2" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="268" y="37.5" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(267.9375 0) scale(0.7317584080065169 1) translate(-267.9375 0)" data-ru-fit="0.7318">Устойчивое развитие</text>

  <!-- ===== Part III: Serving band (y 106-180), one territory ===== -->
  <rect x="40" y="106" width="98" height="74" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89" y="139" text-anchor="middle" font-size="12" fill="#475569">Часть III</text>
  <text x="89" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(89 0) scale(0.9768932366334964 1) translate(-89 0)" data-ru-fit="0.9769">Обслуживание</text>
  <line x1="138" y1="143" x2="150" y2="143" stroke="#1F407A" stroke-width="1"/>
  <rect x="150" y="106" width="220" height="74" rx="2" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="150" y1="143" x2="370" y2="143" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="162" y="129" font-size="12.5" font-weight="700" fill="#14294E">Операции</text>
  <text x="162" y="166" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(162 0) scale(0.9227728363687703 1) translate(-162 0)" data-ru-fit="0.9228">Среда исполнения и обслуживание</text>

  <!-- ===== Part II: Distribution band (y 196-270), one territory per row ===== -->
  <rect x="40" y="196" width="98" height="74" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89" y="229" text-anchor="middle" font-size="12" fill="#475569">Часть II</text>
  <text x="89" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(89 0) scale(0.8213272830402722 1) translate(-89 0)" data-ru-fit="0.8213">Распространение</text>
  <path d="M138,233 H144 M144,213 V253 M144,213 H150 M144,253 H150" fill="none" stroke="#1F407A" stroke-width="1"/>
  <rect x="150" y="196" width="220" height="34" rx="2" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="162" y="217.5" font-size="12.5" font-weight="700" fill="#14294E">Надежность и контроль</text>
  <rect x="150" y="236" width="220" height="34" rx="2" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2"/>
  <text x="162" y="257.5" font-size="12.5" font-weight="700" fill="#14294E">Распределенное исполнение</text>

  <!-- ===== Part I: Infrastructure band (y 286-360), one territory ===== -->
  <rect x="40" y="286" width="98" height="74" rx="3" fill="#ffffff" stroke="#1F407A" stroke-width="1.2"/>
  <text x="89" y="319" text-anchor="middle" font-size="12" fill="#475569">Часть I</text>
  <text x="89" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E" transform=" translate(89 0) scale(0.8655110579796772 1) translate(-89 0)" data-ru-fit="0.8655">Инфраструктура</text>
  <line x1="138" y1="323" x2="150" y2="323" stroke="#1F407A" stroke-width="1"/>
  <rect x="150" y="286" width="220" height="74" rx="2" fill="#E3E9F2" stroke="#1F407A" stroke-width="1.2"/>
  <line x1="150" y1="323" x2="370" y2="323" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="162" y="309" font-size="12.5" font-weight="700" fill="#14294E">fabric и хранилище</text>
  <text x="162" y="346" font-size="12.5" font-weight="700" fill="#14294E">Объект и ускорители</text>

  <!-- ===== Principles: leader, numeral chip, name, key metric ===== -->
  <g font-size="12.5">
    <!-- 6 Sustainability (top row, resource half) -->
    <line x1="370" y1="33" x2="386" y2="33" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="24" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="37.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">6</text>
    <text x="412" y="37.5" font-weight="700" fill="#0f172a" transform=" translate(411.9375 0) scale(0.5772569444444444 1) translate(-411.9375 0)" data-ru-fit="0.5773">Устойчивое развитие — это затраты первого порядка.</text>
    <text x="412" y="52" font-size="11" fill="#475569" transform=" translate(412 0) scale(0.8557734204793028 1) translate(-412 0)" data-ru-fit="0.8558">энергия на запрос, углерод</text>
    <!-- 5 Responsibility (Assurance row plus governance half) -->
    <line x1="370" y1="72" x2="386" y2="72" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="63" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="76.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>
    <text x="412" y="76.5" font-weight="700" fill="#0f172a" transform=" translate(412 0) scale(0.7916773367477593 1) translate(-412 0)" data-ru-fit="0.7917">Ответственность ограничивает дизайн</text>
    <text x="412" y="91" font-size="11" fill="#475569" transform=" translate(412 0) scale(0.5873073217726397 1) translate(-412 0)" data-ru-fit="0.5873">бюджет конфиденциальности, ошибка подгруппы</text>
    <!-- 4 Serving (whole band) -->
    <line x1="370" y1="143" x2="386" y2="143" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="134" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="147.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
    <text x="412" y="147.5" font-weight="700" fill="#0f172a" transform=" translate(412 0) scale(0.81685900652283 1) translate(-412 0)" data-ru-fit="0.8169">Обслуживание ограничено контрактом.</text>
    <text x="412" y="162" font-size="11" fill="#475569" transform=" translate(412 0) scale(0.8376051459673429 1) translate(-412 0)" data-ru-fit="0.8376">задержка p99 в пределах SLO</text>
    <!-- 3 Failure (Reliability & Control row) -->
    <line x1="370" y1="213" x2="386" y2="213" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="204" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="217.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
    <text x="412" y="217.5" font-weight="700" fill="#0f172a" transform=" translate(412 0) scale(0.6458842705786471 1) translate(-412 0)" data-ru-fit="0.6459">Неудача – обычное дело</text>
    <text x="412" y="232" font-size="11" fill="#475569" transform=" translate(412 0) scale(0.7064492811822344 1) translate(-412 0)" data-ru-fit="0.7064">MTBF, затраты на контрольные точки</text>
    <!-- 2 Communication (Distributed Execution row) -->
    <line x1="370" y1="253" x2="386" y2="253" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="244" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="257.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
    <text x="412" y="257.5" font-weight="700" fill="#0f172a" transform=" translate(412 0) scale(0.9228109672750663 1) translate(-412 0)" data-ru-fit="0.9228">Общение может доминировать</text>
    <text x="412" y="272" font-size="11" fill="#475569">раскрыто время связи</text>
    <!-- 1 Infrastructure (whole band) -->
    <line x1="370" y1="323" x2="386" y2="323" stroke="#1F407A" stroke-width="1"/>
    <rect x="386" y="314" width="18" height="18" rx="2" fill="#1F407A"/>
    <text x="395" y="327.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
    <text x="412" y="327.5" font-weight="700" fill="#0f172a" transform=" translate(412 0) scale(0.7914975266389873 1) translate(-412 0)" data-ru-fit="0.7915">Инфраструктура определяет возможности</text>
    <text x="412" y="342" font-size="11" fill="#475569" transform=" translate(412 0) scale(0.578761574074074 1) translate(-412 0)" data-ru-fit="0.5788">FLOP/с, пропускная способность, мощность стойки</text>
  </g>

  <!-- ===== Scale arrow: runs the length of the stack ===== -->
  <path d="M26,360 V20" fill="none" stroke="#14294E" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="14" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E" transform="rotate(-90 14 188) translate(14 0) scale(0.9021451660299735 1) translate(-14 0)" data-ru-fit="0.9021">создает качественные изменения</text>
  </g>
