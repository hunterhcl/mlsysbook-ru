<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Epoch fencing during recovery. Violet = coordination (C3), blue = workers (C1),
       green = durable checkpoint store, red = rejected stale write. Time runs left to right. -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="290" fill="#ffffff"/>

  <!-- ===== Lane guides (drawn first, behind everything) ===== -->
  <g stroke="#cbd5e1" stroke-width="0.8">
    <line x1="120" y1="40" x2="670" y2="40"/>
    <line x1="120" y1="100" x2="380" y2="100"/>
    <line x1="120" y1="160" x2="230" y2="160"/>
    <line x1="610" y1="160" x2="670" y2="160"/>
  </g>

  <!-- ===== Lane labels ===== -->
  <g font-size="12" font-weight="700" fill="#0f172a">
    <text x="12" y="44" transform=" translate(12.000000953674316 0) scale(0.8578586904613249 1) translate(-12.000000953674316 0)" data-ru-fit="0.8579">Координатор</text>
    <text x="12" y="104">Замена</text>
    <text x="12" y="164" transform=" translate(12.000000953674316 0) scale(0.6387049598337741 1) translate(-12.000000953674316 0)" data-ru-fit="0.6387">Старый рабочий</text>
    <text x="12" y="236" transform=" translate(12.000000953674316 0) scale(0.567831307630741 1) translate(-12.000000953674316 0)" data-ru-fit="0.5678">Контрольная точка</text>
    <text x="12" y="251" transform=" translate(12.000000953674316 0) scale(0.6002982262217675 1) translate(-12.000000953674316 0)" data-ru-fit="0.6003">магазин</text>
  </g>

  <!-- ===== Coordinator: membership epochs ===== -->
  <rect x="120" y="28" width="230" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="235" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">эпоха 7</text>
  <rect x="350" y="28" width="320" height="24" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">эпоха 8</text>
  <text x="300" y="18" text-anchor="middle" font-size="11" fill="#6d28d9" transform=" translate(300.00000762939453 0) scale(0.5569980925526072 1) translate(-300.00000762939453 0)" data-ru-fit="0.5570">истекает срок аренды</text>
  <line x1="300" y1="21" x2="300" y2="28" stroke="#7c3aed" stroke-width="1.2"/>

  <!-- ===== Replacement joins in epoch 8 ===== -->
  <rect x="380" y="88" width="290" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="530" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">токен 8</text>

  <!-- ===== Old worker: active, paused or partitioned, then resumes ===== -->
  <rect x="120" y="148" width="110" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="175" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">токен 7</text>
  <line x1="230" y1="160" x2="530" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="467" y="152" text-anchor="middle" font-size="11" fill="#64748b" transform=" translate(467.00000762939453 0) scale(0.6394241298437335 1) translate(-467.00000762939453 0)" data-ru-fit="0.6394">приостановлено или разделено</text>
  <rect x="530" y="148" width="80" height="24" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="570" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">резюме</text>

  <!-- ===== Checkpoint store: enforced epoch ===== -->
  <rect x="120" y="224" width="240" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="240" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">принимает эпоху ≥ 7</text>
  <rect x="360" y="224" width="310" height="28" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="515" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">принимает эпоху ≥ 8</text>

  <!-- 1. Coordinator advances the enforced epoch at the store -->
  <line x1="356" y1="52" x2="356" y2="222" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="348" y="126" text-anchor="end" font-size="11" fill="#6d28d9" transform=" translate(347.99999237060547 0) scale(0.593879666304892 1) translate(-347.99999237060547 0)" data-ru-fit="0.5939">продвижение</text>
  <text x="348" y="139" text-anchor="end" font-size="11" fill="#6d28d9" transform=" translate(348.00001335144043 0) scale(0.8855780549369727 1) translate(-348.00001335144043 0)" data-ru-fit="0.8856">забор</text>

  <!-- 2. Replacement write with token 8 is accepted -->
  <line x1="395" y1="112" x2="395" y2="222" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="403" y="196" font-size="11" fill="#15803d" transform=" translate(403.0000305175781 0) scale(0.7941787552920723 1) translate(-403.0000305175781 0)" data-ru-fit="0.7942">пишем, фишка 8:</text>
  <text x="403" y="209" font-size="11" fill="#15803d">принято</text>

  <!-- 3. Stale write from the old worker is rejected -->
  <line x1="590" y1="172" x2="590" y2="198" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <g stroke="#dc2626" stroke-width="2.2">
    <line x1="582" y1="203" x2="598" y2="219"/>
    <line x1="598" y1="203" x2="582" y2="219"/>
  </g>
  <text x="574" y="196" text-anchor="end" font-size="11" fill="#b91c1c" transform=" translate(574.0000228881836 0) scale(0.85153806107544 1) translate(-574.0000228881836 0)" data-ru-fit="0.8515">пишем, токен 7:</text>
  <text x="574" y="209" text-anchor="end" font-size="11" fill="#b91c1c" transform=" translate(574.0000190734863 0) scale(0.7289845478977741 1) translate(-574.0000190734863 0)" data-ru-fit="0.7290">отклонено</text>

  <!-- ===== Time axis ===== -->
  <line x1="120" y1="272" x2="672" y2="272" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="120" y="286" font-size="11" fill="#64748b" transform=" translate(120 0) scale(0.6655211568404972 1) translate(-120 0)" data-ru-fit="0.6655">время</text>
<metadata id="original-source-labels">Coordinator
Replacement
Old worker
Checkpoint
store
epoch 7
epoch 8
lease expires
token 8
token 7
paused or partitioned
resumes
accepts epoch ≥ 7
accepts epoch ≥ 8
advance
fence
write, token 8:
accepted
write, token 7:
rejected
time</metadata></svg>