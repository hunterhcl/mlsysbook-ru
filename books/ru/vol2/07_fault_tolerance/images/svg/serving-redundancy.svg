  <rect x="540" y="130" width="120" height="92" rx="2" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="600.0" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E" transform=" translate(600.0000228881836 0) scale(0.746981371304117 1) translate(-600.0000228881836 0)" data-ru-fit="0.7470">Теплый режим ожидания</text>
  <rect x="550" y="160" width="100" height="18" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="600.0" y="173" text-anchor="middle" font-size="11" fill="#14294E">веса</text>
  <rect x="550" y="188" width="100" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="600" y="201" text-anchor="middle" font-size="11" fill="#64748b">простой</text>
  <path d="M550,230 V236 H650 V230" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="650" y="252" text-anchor="end" font-size="12" fill="#0f172a" transform=" translate(649.9999847412109 0) scale(0.8488516158847665 1) translate(-649.9999847412109 0)" data-ru-fit="0.8489">загружен, ничего не даёт</text>
