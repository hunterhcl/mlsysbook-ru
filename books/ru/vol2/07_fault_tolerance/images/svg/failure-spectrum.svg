  <line x1="477" y1="168" x2="649" y2="168" stroke="#64748b" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <text x="477" y="182" font-size="11" fill="#475569">попытки</text>
  <text x="560" y="206" text-anchor="middle" font-size="12" fill="#334155" transform=" translate(559.9780426025391 0) scale(0.7670847922502688 1) translate(-559.9780426025391 0)" data-ru-fit="0.7671"><tspan font-style="italic" font-size="11" fill="#64748b">причина:</tspan><tspan dx="4">застревание, неисправность, износ</tspan></text>
  <rect x="480" y="220" width="160" height="28" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="560" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">заменить и восстановить</text>
<metadata id="original-source-labels">clears on its own
fault persistence
lasts until repaired
Transient
occurs once
attempts
cause:
particle strike
retry or roll back
Intermittent
recurs under load
load
attempts
cause:
cracked solder joint
drain and stress-test
Permanent
fails on every retry
attempts
cause:
stuck-at fault, wear-out
replace and restore</metadata></svg>