  <line x1="257" y1="168" x2="429" y2="168" stroke="#64748b" stroke-width="0.8" marker-end="url(#arr-gray)"/>
  <text x="257" y="182" font-size="11" fill="#475569">попытки</text>
  <text x="340" y="206" text-anchor="middle" font-size="12" fill="#334155" transform=" translate(339.97803497314453 0) scale(0.8790275880550255 1) translate(-339.97803497314453 0)" data-ru-fit="0.8790"><tspan font-style="italic" font-size="11" fill="#64748b">причина:</tspan><tspan dx="4">треснутое паяное соединение</tspan></text>
  <rect x="260" y="220" width="160" height="28" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
