  <rect x="130" y="92" width="100" height="50" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="180" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Координатор</text>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#b91c1c">предел входа</text>
  <line x1="230" y1="117" x2="248" y2="117" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>
  <rect x="250" y="92" width="80" height="50" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="290" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Общий</text>
  <text x="290" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">хранилище</text>

  <line x1="340" y1="10" x2="340" y2="320" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

