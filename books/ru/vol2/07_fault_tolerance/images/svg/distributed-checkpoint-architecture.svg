  <g font-size="12" font-weight="700" fill="#14294E" text-anchor="middle">
    <rect x="350" y="36" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="55">Рабочий 0</text>
    <rect x="350" y="80" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="99">Рабочий 1</text>
    <rect x="350" y="124" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="390" y="143">Рабочий 2</text>
