<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -14 704 360" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Left: centralized checkpointing funnels every shard through one coordinator (red bottleneck).
       Right: distributed checkpointing writes each shard to local NVMe in parallel, then drains to
       object storage in the background. Bottom strips: when each shard write happens on a shared time axis.
       Blue = workers, green = storage writes, red = the coordinator bottleneck, gray dashed = background drain. -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="-12" y="-14" width="704" height="360" fill="#ffffff"/>

  <!-- ===== Left: centralized ===== -->
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(170.00001525878906 0) scale(0.5625677414192324 1) translate(-170.00001525878906 0)" data-ru-fit="0.5626">Централизованный</text>
  <g font-size="12" font-weight="700" fill="#14294E" text-anchor="middle">
    <rect x="10" y="36" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="55">Рабочий 0</text>
    <rect x="10" y="80" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="99">Рабочий 1</text>
    <rect x="10" y="124" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="143">Рабочий 2</text>
    <rect x="10" y="168" width="80" height="30" rx="2" fill="#EAF1F8" stroke="#1F407A"/><text x="50" y="187">Рабочий 3</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.4" fill="none">
    <path d="M90,51 H112 V110"/>
    <path d="M90,95 H112"/>
    <path d="M90,139 H112"/>
    <path d="M90,183 H112 V110"/>
    <line x1="112" y1="117" x2="128" y2="117" marker-end="url(#arr-red)"/>
