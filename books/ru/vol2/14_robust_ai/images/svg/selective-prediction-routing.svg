<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="700" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Request ===== -->
  <rect x="20" y="105" width="96" height="56" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="68" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Запрос</text>
  <text x="68" y="147" text-anchor="middle" font-size="11" fill="#475569">введите x</text>
  <line x1="116" y1="133" x2="142" y2="133" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- ===== Model + scores ===== -->
  <rect x="146" y="88" width="138" height="90" rx="3" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="215" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Модель</text>
  <text x="215" y="128" text-anchor="middle" font-size="11" fill="#14294E">предсказание f(x)</text>
  <text x="215" y="148" text-anchor="middle" font-size="11" fill="#14294E">выверенная уверенность</text>
  <text x="215" y="165" text-anchor="middle" font-size="11" fill="#14294E">OOD оценка</text>
  <line x1="284" y1="133" x2="310" y2="133" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-gray)"/>

  <!-- ===== Acceptance gate ===== -->
  <rect x="314" y="93" width="112" height="80" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="370" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Принятие</text>
  <text x="370" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">порог</text>
  <text x="370" y="155" text-anchor="middle" font-size="11" fill="#6d28d9">оценка s(x) против τ</text>

  <!-- ===== Branches ===== -->
  <path d="M426,120 L446,120 L446,56 L468,56" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arr-green)"/>
  <line x1="426" y1="133" x2="468" y2="133" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arr-purple)"/>
  <path d="M426,146 L446,146 L446,210 L468,210" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-red)"/>

  <!-- Answer -->
  <rect x="472" y="30" width="200" height="52" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="484" y="52" font-size="12" font-weight="700" fill="#15803d">Ответ</text>
  <text x="484" y="70" font-size="11" fill="#15803d">s(x) ≥ τ: действовать на f(x)</text>

  <!-- Route -->
  <rect x="472" y="107" width="200" height="52" rx="3" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="484" y="129" font-size="12" font-weight="700" fill="#6d28d9">Маршрут</text>
  <text x="484" y="147" font-size="11" fill="#6d28d9" transform=" translate(484 0) scale(0.9462117096620662 1) translate(-484 0)" data-ru-fit="0.9462">более сильная модель или рецензент</text>

  <!-- Abstain -->
  <rect x="472" y="184" width="200" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="484" y="206" font-size="12" font-weight="700" fill="#b91c1c">Воздержались</text>
  <text x="484" y="224" font-size="11" fill="#b91c1c" transform=" translate(484 0) scale(0.6642728904847397 1) translate(-484 0)" data-ru-fit="0.6643">подтвержденное безопасное значение по умолчанию</text>

  <!-- Fallback capacity bracket -->
  <path d="M680,107 L688,107 L688,236 L680,236" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="572" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" transform=" translate(572 0) scale(0.633990636969783 1) translate(-572 0)" data-ru-fit="0.6340">Резервная нагрузка</text>
  <text x="572" y="277" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(572 0) scale(0.7190569744597249 1) translate(-572 0)" data-ru-fit="0.7191">(1 − покрытие) × скорость прибытия,</text>
  <text x="572" y="293" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(572 0) scale(0.6852795280868749 1) translate(-572 0)" data-ru-fit="0.6853">обслуживается в рамках бюджета задержки</text>

  <!-- ===== Risk-coverage inset ===== -->
  <text x="40" y="214" font-size="11" font-weight="700" fill="#0f172a" transform=" translate(40 0) scale(0.7570301783264746 1) translate(-40 0)" data-ru-fit="0.7570">Кривая покрытия риска (иллюстративная форма)</text>
  <line x1="60" y1="300" x2="300" y2="300" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="60" y1="300" x2="60" y2="226" stroke="#64748b" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="296" y="318" text-anchor="end" font-size="11" fill="#475569" transform=" translate(296 0) scale(0.9330882352941177 1) translate(-296 0)" data-ru-fit="0.9331">покрытие →</text>
  <text transform="translate(44 266) rotate(-90) translate(0 0) scale(0.6841572464990721 1) translate(0 0)" text-anchor="middle" font-size="11" fill="#475569" data-ru-fit="0.6842">выборочный риск</text>
  <polyline points="70,296 110,294 150,291 190,286 220,279 245,267 265,254 285,240" fill="none" stroke="#1F407A" stroke-width="1.8"/>
  <circle cx="190" cy="286" r="4" fill="#7c3aed"/>
  <text x="202" y="272" text-anchor="middle" font-size="11" fill="#6d28d9">τ</text>
  <line x1="172" y1="270" x2="122" y2="278" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="140" y="260" text-anchor="middle" font-size="11" fill="#6d28d9" transform=" translate(140 0) scale(0.6302442078897934 1) translate(-140 0)" data-ru-fit="0.6302">поднять τ</text>
<metadata id="original-source-labels">Request
input x
Model
prediction f(x)
calibrated confidence
OOD score
