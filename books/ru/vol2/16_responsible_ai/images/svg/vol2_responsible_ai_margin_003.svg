<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 166" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Стек состязательности</title>
  <desc id="desc">Вертикальная цепочка из четырех этапов: происхождение (с акцентом), объяснение, апелляция и результат, соединенные стрелками вниз; стрелка возврата с надписью «переподготовка» проходит от результата вверх по левой стороне обратно к происхождению.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#777777"/>
    </marker>
  </defs>
  <rect width="180" height="166" fill="#ffffff"/>
  <!-- ===== Feedback loop (outer perimeter) ===== -->
  <path d="M70,142 H20 V22 H68" fill="none" stroke="#777777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="26" y="86" text-anchor="start" font-size="12" fill="#555555" transform=" translate(26 0) scale(0.4008903615141978 1) translate(-26 0)" data-ru-fit="0.4009">переобучиться</text>
  <!-- ===== Chain ===== -->
  <line x1="80" y1="33" x2="80" y2="50" stroke="#777777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="73" x2="80" y2="90" stroke="#777777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="113" x2="80" y2="130" stroke="#777777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="80" cy="22" r="9" fill="#1F407A"/>
  <circle cx="80" cy="62" r="9" fill="#c8c8c8"/>
  <circle cx="80" cy="102" r="9" fill="#c8c8c8"/>
  <circle cx="80" cy="142" r="9" fill="#c8c8c8"/>
  <text x="96" y="26" text-anchor="start" font-size="13" fill="#333333" transform=" translate(96 0) scale(0.7004337019948002 1) translate(-96 0)" data-ru-fit="0.7004">происхождение</text>
  <text x="96" y="66" text-anchor="start" font-size="13" fill="#333333" transform=" translate(96 0) scale(0.9231860415483545 1) translate(-96 0)" data-ru-fit="0.9232">объяснение</text>
  <text x="96" y="106" text-anchor="start" font-size="13" fill="#333333" transform=" translate(96 0) scale(0.6097597287028218 1) translate(-96 0)" data-ru-fit="0.6098">апелляция</text>
  <text x="96" y="146" text-anchor="start" font-size="13" fill="#333333" transform=" translate(96 0) scale(0.8403995280391293 1) translate(-96 0)" data-ru-fit="0.8404">результат</text>
<metadata id="original-source-labels">Contestability Stack
Vertical chain of four stages, provenance (accented), explanation, appeal, and outcome, joined by downward arrows; a return arrow labeled retrain runs from outcome up the left side back to provenance.
retrain
provenance
explanation
appeal
outcome</metadata></svg>