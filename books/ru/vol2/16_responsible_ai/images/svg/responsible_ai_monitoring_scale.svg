<metadata id="original-source-labels">False alarms across monitored metrics
A grid of 150 small gray squares, one per monitored fairness metric; seven and a half squares are red, the expected number of false alerts per evaluation interval at a 5 percent per-metric false-alarm rate.
150 metrics × 5%
≈ 7.5 false alerts
per interval</metadata></svg>