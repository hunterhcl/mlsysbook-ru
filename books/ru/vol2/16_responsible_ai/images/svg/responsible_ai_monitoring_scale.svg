  <title id="title">Ложные тревоги по отслеживаемым показателям</title>
  <desc id="desc">Сетка из 150 маленьких серых квадратов, по одному на каждый контролируемый показатель справедливости; семь с половиной квадратов выделены красным цветом, это ожидаемое количество ложных оповещений за интервал оценки при уровне ложных срабатываний 5 процентов на каждый показатель.</desc>
  <rect width="180" height="178" fill="#ffffff"/>
  <text x="90" y="17" text-anchor="middle" font-size="13" fill="#333333" transform=" translate(90.00000381469727 0) scale(0.7537420989257598 1) translate(-90.00000381469727 0)" data-ru-fit="0.7537">150 показателей × 5%</text>
