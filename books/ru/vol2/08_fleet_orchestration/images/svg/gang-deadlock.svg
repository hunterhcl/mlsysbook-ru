  <path d="M216,150 C256,150 256,106 221,106" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="282" y="132" text-anchor="start" font-size="11" fill="#b91c1c" transform=" translate(282 0) scale(0.9823609590415254 1) translate(-282 0)" data-ru-fit="0.9824">ждет</text>
  <text x="180" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c" transform=" translate(180.0000123977661 0) scale(0.550142971592077 1) translate(-180.0000123977661 0)" data-ru-fit="0.5501">Имеется 8 GPU, ни один не выполняет вычисления.</text>
  <text x="520" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(519.9999809265137 0) scale(0.933372664085721 1) translate(-519.9999809265137 0)" data-ru-fit="0.9334">Расписание банд</text>
  <text x="360" y="48" font-size="11" fill="#475569" transform=" translate(360 0) scale(0.7149958511036957 1) translate(-360 0)" data-ru-fit="0.7150">очередь</text>
  <line x1="410" y1="58" x2="660" y2="58" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="410" y1="70" x2="660" y2="70" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="410" y1="84" x2="660" y2="84" stroke="#e2e8f0" stroke-width="0.8"/>
