  <text x="160.0" y="47" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14294E">шаг <tspan font-style="italic">i</tspan></text>
  <rect x="190" y="20" width="80" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230.0" y="39" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c"><tspan font-style="italic">T</tspan><tspan font-size="11.5" dy="3">write</tspan></text>
  <text x="230.0" y="55" text-anchor="middle" font-size="11.5" fill="#b91c1c" transform=" translate(230 0) scale(0.8255105320411392 1) translate(-230 0)" data-ru-fit="0.8255">приостановлено</text>
