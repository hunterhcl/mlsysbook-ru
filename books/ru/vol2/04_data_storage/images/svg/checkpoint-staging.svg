  <line x1="480" y1="144" x2="480" y2="268" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="82" x2="570" y2="268" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="116" y="39" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(116 0) scale(0.7875311720698255 1) translate(-116 0)" data-ru-fit="0.7875">Обучение</text>
  <text x="116" y="55" text-anchor="end" font-size="11.5" fill="#64748b">ускорители</text>
  <text x="116" y="101" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(116 0) scale(0.7495291902071564 1) translate(-116 0)" data-ru-fit="0.7495">Местный NVMe</text>
  <text x="116" y="117" text-anchor="end" font-size="11.5" fill="#64748b">за узел</text>
  <text x="116" y="163" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(116 0) scale(0.6235224586288416 1) translate(-116 0)" data-ru-fit="0.6235">Параллельно FS</text>
  <text x="116" y="179" text-anchor="end" font-size="11.5" fill="#64748b" transform=" translate(116 0) scale(0.6056338028169014 1) translate(-116 0)" data-ru-fit="0.6056">поделился</text>
  <text x="116" y="225" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(116 0) scale(0.8578378378378378 1) translate(-116 0)" data-ru-fit="0.8578">Координатор</text>
