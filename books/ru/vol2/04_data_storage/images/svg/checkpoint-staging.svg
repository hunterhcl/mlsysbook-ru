  <text x="465.0" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#14294E">Обучение продолжается в режиме реального времени.</text>
  <rect x="190" y="82" width="80" height="44" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="230.0" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">запись</text>
