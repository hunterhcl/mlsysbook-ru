  <text x="190" y="309" text-anchor="middle" font-size="11.5" fill="#475569" transform=" translate(190 0) scale(0.8022641509433962 1) translate(-190 0)" data-ru-fit="0.8023">триггер</text>
  <line x1="270" y1="268" x2="270" y2="276" stroke="#64748b" stroke-width="1.2"/>
