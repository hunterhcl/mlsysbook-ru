  <path d="M72,208 V146 H336 V100" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="204" y="139" text-anchor="middle" font-size="11" fill="#6d28d9" transform=" translate(204 0) scale(0.7051356589147287 1) translate(-204 0)" data-ru-fit="0.7051">дрейф подсказывает проверку</text>

