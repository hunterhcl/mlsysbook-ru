  <text x="138" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155" transform=" translate(138 0) scale(0.8746064085941841 1) translate(-138 0)" data-ru-fit="0.8746">Непрерывная интеграция (CI)</text>
  <path d="M16,40 V32 H260 V40" fill="none" stroke="#94a3b8" stroke-width="1"/>
