<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="660" height="444" fill="#ffffff"/>
  <g transform="translate(10,10)">

  <!-- ===== Impact region: every consumer the user embedding reaches ===== -->
  <rect x="134" y="186" width="482" height="224" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="148" y="350" font-size="11.5" font-weight="700" fill="#6d28d9">скоординировано</text>
  <text x="148" y="366" font-size="11.5" font-weight="700" fill="#6d28d9">оценка</text>

  <!-- ===== Tier labels ===== -->
  <text x="16" y="43" font-size="11.5" fill="#475569" transform=" translate(16 0) scale(0.726709746903608 1) translate(-16 0)" data-ru-fit="0.7267">Источники</text>
  <text x="16" y="123" font-size="11.5" fill="#475569">Вложения</text>
  <text x="16" y="223" font-size="11.5" fill="#475569" transform=" translate(16 0) scale(0.4221014492753623 1) translate(-16 0)" data-ru-fit="0.4221">Средний уровень</text>
  <text x="16" y="303" font-size="11.5" fill="#475569" transform=" translate(16 0) scale(0.9693251533742331 1) translate(-16 0)" data-ru-fit="0.9693">Рейтинг</text>
  <text x="16" y="379" font-size="11.5" fill="#475569" transform=" translate(16 0) scale(0.6174496644295302 1) translate(-16 0)" data-ru-fit="0.6174">Правила</text>

  <!-- ===== Sources ===== -->
  <rect x="150" y="16" width="200" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="250" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d" transform=" translate(249.9654998779297 0) scale(0.9283514951246652 1) translate(-249.9654998779297 0)" data-ru-fit="0.9284">Журналы поведения пользователей</text>
  <text x="250" y="52" text-anchor="middle" font-size="11.5" fill="#15803d">клики, сеансы</text>
  <rect x="400" y="16" width="200" height="46" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="500" y="35" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Каталог продукции</text>
  <text x="500" y="52" text-anchor="middle" font-size="11.5" fill="#15803d">названия, атрибуты</text>
  <path d="M250,62 V94" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <path d="M500,62 V94" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- ===== Embeddings: the user embedding is the changed model ===== -->
  <rect x="150" y="96" width="200" height="46" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Встраивание пользователя</text>
  <text x="250" y="132" text-anchor="middle" font-size="11.5" fill="#6d28d9">история поведения</text>
  <rect x="400" y="96" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Встраивание продукта</text>
  <text x="500" y="132" text-anchor="middle" font-size="11.5" fill="#14294E">векторы предметов</text>

  <!-- ===== Shared bus: both embeddings reach both mid-tier models ===== -->
  <path d="M500,142 V168" stroke="#1F407A" stroke-width="1.5"/>
  <path d="M250,142 V168" stroke="#7c3aed" stroke-width="2"/>
  <path d="M250,168 H500" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="250" cy="168" r="3.5" fill="#7c3aed"/>
  <circle cx="500" cy="168" r="3.5" fill="#7c3aed"/>
  <text x="375" y="160" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(375 0) scale(0.6982224885160775 1) translate(-375 0)" data-ru-fit="0.6982">общий автобус</text>
  <path d="M250,168 V194" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <path d="M500,168 V194" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- ===== Mid-tier models ===== -->
  <rect x="150" y="196" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="250" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Поиск кандидата</text>
  <text x="250" y="232" text-anchor="middle" font-size="11.5" fill="#14294E">поиск ближайшего соседа</text>
  <rect x="400" y="196" width="200" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="500" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Чувствительность к цене</text>
  <text x="500" y="232" text-anchor="middle" font-size="11.5" fill="#14294E">готовность платить</text>

  <!-- ===== Merge into ranking ===== -->
  <path d="M250,242 V258 H500 V242" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M375,258 V274" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="265" y="276" width="220" height="46" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.5"/>
  <text x="375" y="295" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14294E">Модель ранжирования</text>
  <text x="375" y="312" text-anchor="middle" font-size="11.5" fill="#14294E">pCTR × pКупить</text>

  <!-- ===== Business rules ===== -->
  <path d="M375,322 V350" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <rect x="265" y="352" width="220" height="46" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="371" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Бизнес-правила</text>
  <text x="375" y="388" text-anchor="middle" font-size="11.5" fill="#334155">инвентарь, акции</text>
  </g>
