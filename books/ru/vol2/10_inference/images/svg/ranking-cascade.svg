  <text x="540" y="290" text-anchor="start" font-size="12" font-weight="400" font-style="italic" fill="#475569" transform=" translate(538.7999877929688 0) scale(0.7656967185534164 1) translate(-538.7999877929688 0)" data-ru-fit="0.7657">длина полосы ∝ бюджет</text>
