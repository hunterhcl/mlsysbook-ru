  <text x="20" y="128" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" transform=" translate(20 0) scale(0.7957114186120207 1) translate(-20 0)" data-ru-fit="0.7957">Рейтинг первого этапа</text>
  <text x="20" y="145" text-anchor="start" font-size="12" font-weight="400" fill="#475569" transform=" translate(20 0) scale(0.7561378959419921 1) translate(-20 0)" data-ru-fit="0.7561">двухбашенный, GBDT</text>
  <rect x="540" y="123" width="22" height="16" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
