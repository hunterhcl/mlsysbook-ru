  <text x="20" y="201" text-anchor="start" font-size="12" font-weight="400" fill="#475569" transform=" translate(20 0) scale(0.8422531254389661 1) translate(-20 0)" data-ru-fit="0.8423">глубина MLP, DLRM</text>
  <rect x="540" y="179" width="55" height="16" rx="1" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
