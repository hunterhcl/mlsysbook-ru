<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="920" height="648" fill="#ffffff"/>

  <!-- ===== Legend: cohorts ===== -->
  <rect x="70" y="26" width="22" height="16" rx="1" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="100" y="39" font-size="15" fill="#334155" transform=" translate(100 0) scale(0.6280892659535227 1) translate(-100 0)" data-ru-fit="0.6281">флагманские телефоны</text>
  <rect x="260" y="26" width="22" height="16" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="290" y="39" font-size="15" fill="#334155" transform=" translate(290 0) scale(0.5449573749396815 1) translate(-290 0)" data-ru-fit="0.5450">телефоны среднего уровня</text>
  <rect x="450" y="26" width="22" height="16" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="480" y="39" font-size="15" fill="#334155" transform=" translate(480 0) scale(0.6413118640719154 1) translate(-480 0)" data-ru-fit="0.6413">бюджетные телефоны</text>

  <!-- ===== Stage columns (bottom-aligned at y=330; stack: budget, mid, flagship) ===== -->
  <!-- Deployed: 240 = 48 / 144 / 48 -->
  <rect x="70" y="282" width="100" height="48" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="70" y="138" width="100" height="144" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="70" y="90" width="100" height="48" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <!-- Admitted: 160 = 16 / 96 / 48 -->
  <rect x="300" y="314" width="100" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="300" y="218" width="100" height="96" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="300" y="170" width="100" height="48" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <!-- Selected: 120 = 12 / 72 / 36 (uniform sample keeps the admitted mix) -->
  <rect x="530" y="318" width="100" height="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="530" y="246" width="100" height="72" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="530" y="210" width="100" height="36" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <!-- Completed: 90 = 5 / 49 / 36 -->
  <rect x="760" y="325" width="100" height="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="760" y="276" width="100" height="49" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="760" y="240" width="100" height="36" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>

  <!-- Baseline -->
  <path d="M50,330 H880" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== Filters between stages ===== -->
  <text x="235" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">вход</text>
  <text x="235" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#334155" transform=" translate(235 0) scale(0.8436592449177154 1) translate(-235 0)" data-ru-fit="0.8437">тест</text>
  <path d="M182,296 H288" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="465" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">выбор</text>
  <path d="M412,296 H518" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="695" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c" transform=" translate(695 0) scale(0.672209624590577 1) translate(-695 0)" data-ru-fit="0.6722">круглый</text>
  <text x="695" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">срок</text>
  <path d="M642,296 H748" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- ===== Stage labels ===== -->
  <text x="120" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" transform=" translate(120 0) scale(0.8554493307839388 1) translate(-120 0)" data-ru-fit="0.8554">развернут</text>
  <text x="120" y="376" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(120 0) scale(0.7162944582299421 1) translate(-120 0)" data-ru-fit="0.7163">весь автопарк</text>
  <text x="350" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" transform=" translate(350 0) scale(0.856353591160221 1) translate(-350 0)" data-ru-fit="0.8564">допущено</text>
  <text x="350" y="376" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(350 0) scale(0.9282581805914765 1) translate(-350 0)" data-ru-fit="0.9283">зарядка, Wi-Fi, круто</text>
  <text x="580" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" transform=" translate(580 0) scale(0.9309417040358744 1) translate(-580 0)" data-ru-fit="0.9309">выбрано</text>
  <text x="580" y="376" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(580 0) scale(0.814026792750197 1) translate(-580 0)" data-ru-fit="0.8140">перевыбранная когорта</text>
  <text x="810" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" transform=" translate(810 0) scale(0.9255034753163429 1) translate(-810 0)" data-ru-fit="0.9255">завершено</text>
  <text x="810" y="376" text-anchor="middle" font-size="14" fill="#475569" transform=" translate(810 0) scale(0.8545041791352802 1) translate(-810 0)" data-ru-fit="0.8545">входит в совокупность</text>

  <!-- Divider -->
  <path d="M50,404 H880" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== Coverage ratio per cohort ===== -->
  <text x="70" y="440" font-size="15" font-weight="700" fill="#0f172a" transform=" translate(70 0) scale(0.5712558300224564 1) translate(-70 0)" data-ru-fit="0.5713">коэффициент покрытия</text>
  <text x="70" y="460" font-size="14" fill="#475569" transform=" translate(70 0) scale(0.5620753801358783 1) translate(-70 0)" data-ru-fit="0.5621">завершенный общий ресурс ÷ развернутый общий ресурс</text>
  <!-- proportional reference drawn first so bars sit over it; scale: ratio 1 = 200 px from x = 400 -->
  <path d="M600,470 V570" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="400" y="474" width="400" height="20" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="390" y="489" text-anchor="end" font-size="15" fill="#334155" transform=" translate(390 0) scale(0.8517110266159695 1) translate(-390 0)" data-ru-fit="0.8517">флагман</text>
  <rect x="400" y="506" width="182" height="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="390" y="521" text-anchor="end" font-size="15" fill="#334155" transform=" translate(390 0) scale(0.42960475329372255 1) translate(-390 0)" data-ru-fit="0.4296">средний уровень</text>
  <rect x="400" y="538" width="56" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="390" y="553" text-anchor="end" font-size="15" fill="#334155" transform=" translate(390 0) scale(0.8518622234668161 1) translate(-390 0)" data-ru-fit="0.8519">бюджет</text>
  <!-- axis -->
  <path d="M400,468 V570" fill="none" stroke="#64748b" stroke-width="1"/>
  <path d="M400,570 H820" fill="none" stroke="#64748b" stroke-width="1"/>
  <path d="M400,570 v5 M600,570 v5 M800,570 v5" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="592" text-anchor="middle" font-size="14" fill="#475569">0</text>
  <text x="600" y="592" text-anchor="middle" font-size="14" fill="#475569">1</text>
  <text x="800" y="592" text-anchor="middle" font-size="14" fill="#475569">2</text>
  <text x="600" y="616" text-anchor="middle" font-size="14" fill="#15803d" transform=" translate(600 0) scale(0.7594410328320681 1) translate(-600 0)" data-ru-fit="0.7594">1 = представлено пропорционально его размеру</text>
