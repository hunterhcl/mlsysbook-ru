<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 250" version="1.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Установленная память класса устройства в логарифмическом масштабе</title>
  <rect x="0" y="0" width="180" height="250" fill="#ffffff"/>
  <!-- log10 scale in KiB: floor 128 KiB at x=3.6; 31.54 px per decade.
       Phone 16 GiB (FlagshipSmartphoneRamHigh), IoT 1 GiB (IotMemoryHigh, range top),
       MCU 256 KiB (MicrocontrollerSram). -->
  <rect x="3.6" y="23.4" width="161.4" height="48.6" fill="#006395"/>
  <text x="160" y="53" font-size="14" fill="#ffffff" text-anchor="end">Телефон 16 GB</text>
  <rect x="3.6" y="97.5" width="123.4" height="48.6" fill="#006395"/>
  <text x="122" y="127" font-size="14" fill="#ffffff" text-anchor="end" transform=" translate(121.99999618530273 0) scale(0.6964281096771118 1) translate(-121.99999618530273 0)" data-ru-fit="0.6964">Интернет вещей до 1 GB</text>
  <rect x="3.6" y="171.6" width="9.5" height="48.6" fill="#006395"/>
  <text x="22" y="201" font-size="14" fill="#333333">MCU 256 KB</text>
  <text x="176" y="238" font-size="12" fill="#777777" text-anchor="end" transform=" translate(175.9999885559082 0) scale(0.7885449012151914 1) translate(-175.9999885559082 0)" data-ru-fit="0.7885">лог. шкала</text>
  <line x1="3" y1="246" x2="177" y2="246" stroke="#cccccc" stroke-width="1.36"/>
<metadata id="original-source-labels">Device-class installed memory on a log scale
Phone 16 GB
IoT up to 1 GB
MCU 256 KB
log scale</metadata></svg>