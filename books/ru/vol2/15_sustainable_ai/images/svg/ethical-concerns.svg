<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="740" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Three concern groups stand on the transparency layer: all three are assessed with the
       one shared set of per-model records (energy, carbon, water) that the layer leaves undisclosed,
       so the records form a single centered row with one trunk branching to every card.
       Category concepts own no color, so the focal layer is marked by weight, not hue. -->

  <!-- ===== Concern cards (supporting, light) ===== -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2">
    <rect x="20" y="20" width="223" height="100" rx="4"/>
    <rect x="258.5" y="20" width="223" height="100" rx="4"/>
    <rect x="497" y="20" width="223" height="100" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">
    <text x="131.5" y="54" transform=" translate(131.5 0) scale(0.8889465827221393 1) translate(-131.5 0)" data-ru-fit="0.8889">Экологическая справедливость</text>
    <text x="370" y="54" transform=" translate(370 0) scale(0.7590981231980484 1) translate(-370 0)" data-ru-fit="0.7591">Справедливость между поколениями</text>
    <text x="608.5" y="54">Конкурс ресурсов</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#334155">
    <text x="131.5" y="82">забор воды</text>
    <text x="131.5" y="101">напряжение сетки</text>
    <text x="370" y="82">Стойкость CO₂</text>
    <text x="370" y="101">долгоживущая инфраструктура</text>
    <text x="608.5" y="82" transform=" translate(608.5 0) scale(0.6879489225857941 1) translate(-608.5 0)" data-ru-fit="0.6879">сельскохозяйственные, муниципальные претензии</text>
    <text x="608.5" y="101" transform=" translate(608.5 0) scale(0.9575782823022981 1) translate(-608.5 0)" data-ru-fit="0.9576">земля · вода · полезные ископаемые</text>
  </g>

  <!-- ===== Telemetry: one trunk rises from the shared records and branches to all three cards ===== -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="370" y1="190" x2="370" y2="121" marker-end="url(#arr-gray)"/>
    <path d="M131.5,165 H608.5"/>
    <line x1="131.5" y1="165" x2="131.5" y2="121" marker-end="url(#arr-gray)"/>
    <line x1="608.5" y1="165" x2="608.5" y2="121" marker-end="url(#arr-gray)"/>
  </g>
  <text x="250.75" y="157" text-anchor="middle" font-size="13" fill="#334155" transform=" translate(250.75 0) scale(0.6198421489891996 1) translate(-250.75 0)" data-ru-fit="0.6198">оценивается с помощью телеметрии</text>

  <!-- ===== Transparency gap: the focal layer (heavier stroke, darker neutral) ===== -->
  <rect x="20" y="190" width="700" height="110" rx="4" fill="#eef2f6" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="216" font-size="15" font-weight="700" fill="#0f172a">Пробел в прозрачности</text>
  <text x="370" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">записи для каждой модели</text>
  <text x="700" y="216" text-anchor="end" font-size="13" fill="#334155">здесь действует инженерия</text>

  <!-- one shared records row, centered on the trunk; no column belongs to a single card -->
  <g font-size="13" text-anchor="middle" fill="#0f172a" font-weight="700">
    <text x="270" y="250">энергия</text>
    <text x="370" y="250">углерод</text>
    <text x="470" y="250">вода</text>
  </g>
  <line x1="222" y1="258" x2="518" y2="258" stroke="#94a3b8" stroke-width="0.8"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="1" stroke-dasharray="4 3">
    <rect x="226" y="266" width="88" height="24" rx="2"/>
    <rect x="326" y="266" width="88" height="24" rx="2"/>
    <rect x="426" y="266" width="88" height="24" rx="2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#334155" font-style="italic">
    <text x="270" y="282.5" transform=" translate(269.9739990234375 0) scale(0.7902036478908755 1) translate(-269.9739990234375 0)" data-ru-fit="0.7902">не разглашается</text>
    <text x="370" y="282.5" transform=" translate(369.9739990234375 0) scale(0.7902036478908755 1) translate(-369.9739990234375 0)" data-ru-fit="0.7902">не разглашается</text>
    <text x="470" y="282.5" transform=" translate(469.9739990234375 0) scale(0.7902036478908755 1) translate(-469.9739990234375 0)" data-ru-fit="0.7902">не разглашается</text>
  </g>
