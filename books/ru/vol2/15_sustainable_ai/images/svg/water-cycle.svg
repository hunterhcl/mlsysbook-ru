<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 42 764 264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="-10" y="42" width="764" height="264" fill="#ffffff"/>
  <defs>
    <marker id="arr-water" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#006395"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#008F45"/>
    </marker>
    <marker id="arr-loss" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#78492A"/>
    </marker>
  </defs>

  <!-- ===== Watershed: the local water account ===== -->
  <rect x="12" y="70" width="80" height="210" rx="4" fill="#D1E6F3" stroke="#006395" stroke-width="1.5"/>
  <text x="52" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#00476b" transform=" translate(52 0) scale(0.8414477310306816 1) translate(-52 0)" data-ru-fit="0.8414">Водораздел</text>

  <!-- ===== Process row ===== -->
  <rect x="172" y="70" width="90" height="50" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="217" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Впуск</text>

  <rect x="292" y="70" width="124" height="50" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="354" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(354 0) scale(0.9051059140443247 1) translate(-354 0)" data-ru-fit="0.9051">Сверхчистая вода</text>
  <text x="354" y="110" text-anchor="middle" font-size="13.5" fill="#334155" transform=" translate(354 0) scale(0.5955398684421627 1) translate(-354 0)" data-ru-fit="0.5955">деионизировать, фильтровать</text>

  <rect x="446" y="70" width="120" height="50" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="506" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" transform=" translate(506 0) scale(0.6344803058593402 1) translate(-506 0)" data-ru-fit="0.6345">Потрясающая обработка</text>
  <text x="506" y="110" text-anchor="middle" font-size="13.5" fill="#334155">CMP, полоскание</text>

  <rect x="446" y="170" width="120" height="50" rx="3" fill="#D4EFDF" stroke="#008F45" stroke-width="1.5"/>
  <text x="506" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Сточные воды</text>
  <text x="506" y="210" text-anchor="middle" font-size="13.5" fill="#334155" transform=" translate(506 0) scale(0.868743182644528 1) translate(-506 0)" data-ru-fit="0.8687">лечить, тестировать</text>

  <!-- ===== Consumed: the focal sink, never returns to the watershed (structural brown, not the energy orange) ===== -->
  <rect x="650" y="70" width="84" height="150" rx="3" fill="#E3D3C8" stroke="#78492A" stroke-width="2.2"/>
  <text x="692" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#4a2c18" transform=" translate(692 0) scale(0.6923628026937957 1) translate(-692 0)" data-ru-fit="0.6924">Израсходовано</text>

  <!-- ===== Flows ===== -->
  <!-- withdrawal, labeled on its own shaft -->
  <line x1="92" y1="95" x2="170" y2="95" stroke="#006395" stroke-width="2.5" marker-end="url(#arr-water)"/>
  <text x="130" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#00476b">вывод</text>
  <line x1="262" y1="95" x2="290" y2="95" stroke="#006395" stroke-width="1.5" marker-end="url(#arr-water)"/>
  <line x1="416" y1="95" x2="444" y2="95" stroke="#006395" stroke-width="1.5" marker-end="url(#arr-water)"/>
  <line x1="506" y1="120" x2="506" y2="168" stroke="#006395" stroke-width="1.5" marker-end="url(#arr-water)"/>

  <!-- consumption: evaporation and other unreturned flows, each labeled on its own shaft -->
  <line x1="566" y1="95" x2="648" y2="95" stroke="#78492A" stroke-width="1.8" marker-end="url(#arr-loss)"/>
  <text x="607" y="86" text-anchor="middle" font-size="13.5" fill="#5a3520">испарение</text>
  <line x1="566" y1="195" x2="648" y2="195" stroke="#78492A" stroke-width="1.8" marker-end="url(#arr-loss)"/>
  <text x="607" y="186" text-anchor="middle" font-size="13.5" fill="#5a3520" transform=" translate(607 0) scale(0.597926430904701 1) translate(-607 0)" data-ru-fit="0.5979">невозвращенный</text>

  <!-- internal reuse loop -->
  <path d="M446,195 H217 V122" fill="none" stroke="#008F45" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="330" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d" transform=" translate(330 0) scale(0.2438961038961039 1) translate(-330 0)" data-ru-fit="0.2439">повторно использованный</text>

  <!-- discharge back to the watershed -->
  <path d="M506,220 V260 H94" fill="none" stroke="#006395" stroke-width="1.5" marker-end="url(#arr-water)"/>
  <text x="300" y="251" text-anchor="middle" font-size="13.5" fill="#00476b">выписан, вернулся</text>
<metadata id="original-source-labels">Watershed
Intake
Ultrapure water
deionize, filter
Fab processing
CMP, rinses
Wastewater
treat, test
Consumed
withdrawal
evaporation
unreturned
reused
discharged, returned</metadata></svg>