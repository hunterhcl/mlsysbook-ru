<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 560 284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="-8" width="560" height="284" fill="#fff"/>
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <pattern id="busy" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- ===== Lane labels ===== -->
  <text x="84" y="74" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a" transform=" translate(84 0) scale(0.8418866080156403 1) translate(-84 0)" data-ru-fit="0.8419">Сигнал сети</text>
  <text x="84" y="88" text-anchor="end" font-size="10.5" fill="#334155">CO<tspan baseline-shift="sub" font-size="9.3">2,grid</tspan>(t)</text>
  <text x="84" y="160" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a" transform=" translate(84 0) scale(0.5029461279461279 1) translate(-84 0)" data-ru-fit="0.5029">Работа</text>
  <text x="84" y="192" text-anchor="end" font-size="10.5" font-weight="700" fill="#0f172a">Емкость</text>

  <!-- ===== Grid carbon signal (schematic) ===== -->
  <rect x="110" y="20" width="120" height="110" fill="#f1f5f9"/>
  <text x="170" y="122" text-anchor="middle" font-size="10" fill="#334155" transform=" translate(170 0) scale(0.9019441154078036 1) translate(-170 0)" data-ru-fit="0.9019">высокоуглеродистые часы</text>
  <line x1="100" y1="130" x2="100" y2="20" stroke="#94a3b8" stroke-width="0.8"/>
  <path d="M100,80 C130,80 140,30 170,30 C210,30 230,112 300,112 C350,112 370,112 400,100 C440,84 480,62 510,60" fill="none" stroke="#334155" stroke-width="1.8"/>
  <text x="330" y="96" text-anchor="middle" font-size="10" fill="#15803d" transform=" translate(330 0) scale(0.7531045533449059 1) translate(-330 0)" data-ru-fit="0.7531">низкоуглеродистое окно</text>

  <!-- ===== Job lane ===== -->
  <rect x="260" y="144" width="140" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="330" y="160" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">соответствует T<tspan baseline-shift="sub" font-size="9.3">job</tspan></text>
  <rect x="400" y="144" width="60" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="430" y="160" text-anchor="middle" font-size="10" fill="#475569" transform=" translate(430 0) scale(0.7099424815119145 1) translate(-430 0)" data-ru-fit="0.7099">резерв времени</text>
  <line x1="110" y1="156" x2="256" y2="156" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="183" y="150" text-anchor="middle" font-size="10" fill="#475569" transform=" translate(183 0) scale(0.5293853342918764 1) translate(-183 0)" data-ru-fit="0.5294">ожидание (с контрольными точками)</text>

  <!-- ===== Capacity lane ===== -->
  <rect x="100" y="178" width="120" height="22" fill="url(#busy)" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="193" text-anchor="middle" font-size="10" fill="#334155">занят</text>
  <rect x="220" y="178" width="300" height="22" fill="#EAF1F8" stroke="#1F407A" stroke-width="1"/>
  <text x="370" y="193" text-anchor="middle" font-size="10" fill="#14294E">запас по высоте N(t)</text>

  <!-- ===== Deadline ===== -->
  <line x1="460" y1="14" x2="460" y2="206" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="466" y="26" font-size="10.5" font-weight="700" fill="#b91c1c">срок</text>

  <!-- ===== Time axis ===== -->
  <line x1="100" y1="212" x2="528" y2="212" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="528" y="226" text-anchor="end" font-size="10" fill="#475569" transform=" translate(528 0) scale(0.6659471127900701 1) translate(-528 0)" data-ru-fit="0.6659">время</text>

  <!-- ===== Net carbon ===== -->
  <text x="300" y="248" text-anchor="middle" font-size="10.5" fill="#0f172a">CO<tspan baseline-shift="sub" font-size="9.3">2,net</tspan> = ∫ P<tspan baseline-shift="sub" font-size="9.3">facility</tspan>(t) CO<tspan baseline-shift="sub" font-size="9.3">2,grid</tspan>(t) dt + CO<tspan baseline-shift="sub" font-size="9.3">2,checkpoint</tspan> + CO<tspan baseline-shift="sub" font-size="9.3">2,idle</tspan> + CO<tspan baseline-shift="sub" font-size="9.3">2,migration</tspan></text>
