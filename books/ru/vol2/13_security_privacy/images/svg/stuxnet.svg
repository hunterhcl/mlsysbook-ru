<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== Trust boundary the payload crosses (air gap / trusted-input boundary) ===== -->
  <path d="M130,40 V250" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,3" fill="none"/>
  <text x="130" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" transform=" translate(130 0) scale(0.3734105906969258 1) translate(-130 0)" data-ru-fit="0.3734">воздушный зазор</text>
  <text x="130" y="280" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(130 0) scale(0.8180525941719972 1) translate(-130 0)" data-ru-fit="0.8181">граница доверия</text>

  <!-- Key for the payload mark -->
  <circle cx="452" cy="276" r="4.5" fill="#dc2626"/>
  <text x="462" y="280" text-anchor="start" font-size="11" fill="#475569" transform=" translate(462 0) scale(0.6058287612623949 1) translate(-462 0)" data-ru-fit="0.6058">скрытая полезная нагрузка, которую несет каждая ступень</text>

  <!-- Column head for the displayed-versus-actual split -->
  <text x="660" y="32" text-anchor="end" font-size="11" fill="#475569" transform=" translate(660 0) scale(0.4216663277065962 1) translate(-660 0)" data-ru-fit="0.4217">отображается по сравнению с фактическим</text>

  <!-- ================= Row 1: Stuxnet ================= -->
  <text x="20" y="32" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a" transform=" translate(20 0) scale(0.8726415094339622 1) translate(-20 0)" data-ru-fit="0.8726">Стакснет (2010)</text>

  <rect x="20" y="44" width="96" height="76" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="68" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">USB-носитель</text>
  <text x="68" y="80" text-anchor="middle" font-size="11" fill="#475569">пересекает</text>
  <text x="68" y="93" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(68 0) scale(0.9833160275147487 1) translate(-68 0)" data-ru-fit="0.9833">воздушный зазор</text>
  <circle cx="68" cy="108" r="4.5" fill="#dc2626"/>

  <rect x="144" y="44" width="96" height="76" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="192" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" transform=" translate(191.97000122070312 0) scale(0.94749945599862 1) translate(-191.97000122070312 0)" data-ru-fit="0.9475">Хосты Windows</text>
  <text x="192" y="80" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(192 0) scale(0.8272635193222274 1) translate(-192 0)" data-ru-fit="0.8273">четыре нулевого дня</text>
  <text x="192" y="93" text-anchor="middle" font-size="11" fill="#475569">эксплойты</text>
  <circle cx="192" cy="108" r="4.5" fill="#dc2626"/>

  <rect x="268" y="44" width="96" height="76" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="316" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Сименс Шаг7</text>
  <text x="316" y="80" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(316 0) scale(0.7230653455412016 1) translate(-316 0)" data-ru-fit="0.7231">PLC программирование</text>
  <text x="316" y="93" text-anchor="middle" font-size="11" fill="#475569">ПО</text>
  <circle cx="316" cy="108" r="4.5" fill="#dc2626"/>

  <rect x="392" y="44" width="96" height="76" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="440" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PLC логика</text>
  <text x="440" y="80" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(440 0) scale(0.7578947368421053 1) translate(-440 0)" data-ru-fit="0.7579">контрольные значения</text>
  <text x="440" y="93" text-anchor="middle" font-size="11" fill="#475569">изменено</text>
  <circle cx="440" cy="108" r="4.5" fill="#dc2626"/>

  <!-- payload path, chip to chip, into the actual outcome -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M73,108 H142" marker-end="url(#arr-red)"/>
    <path d="M197,108 H266" marker-end="url(#arr-red)"/>
    <path d="M321,108 H390" marker-end="url(#arr-red)"/>
    <path d="M445,108 H514" marker-end="url(#arr-red)"/>
  </g>
  <!-- monitoring tap: what the operators are shown -->
  <path d="M488,61 H514" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr-gray)"/>

  <!-- displayed view -->
  <rect x="516" y="44" width="144" height="34" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="588" y="58" text-anchor="middle" font-size="12" fill="#334155" transform=" translate(588 0) scale(0.8303816649303911 1) translate(-588 0)" data-ru-fit="0.8304">Операторы видят нормально</text>
  <path d="M530,69 H646" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <!-- actual outcome -->
  <rect x="516" y="86" width="144" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="588" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" transform=" translate(588 0) scale(0.8971041281577325 1) translate(-588 0)" data-ru-fit="0.8971">Центрифуги повреждены</text>
  <path d="M530,111 L540,111 L545,105 L551,115 L557,104 L563,114 L569,106 L575,115 L581,103 L587,114 L593,105 L599,115 L605,104 L611,113 L617,106 L623,115 L629,104 L635,111 L646,111" stroke="#dc2626" stroke-width="1.3" fill="none" stroke-linejoin="round"/>

  <!-- ================= Row 2: ML supply chain ================= -->
  <text x="20" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a" transform=" translate(20 0) scale(0.7223997409148343 1) translate(-20 0)" data-ru-fit="0.7224">ML цепочка поставок</text>

  <rect x="20" y="164" width="96" height="76" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="68" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E" transform=" translate(68 0) scale(0.5837369885602391 1) translate(-68 0)" data-ru-fit="0.5837">Общественный артефакт</text>
  <text x="68" y="200" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(68 0) scale(0.8140475833672495 1) translate(-68 0)" data-ru-fit="0.8140">пакет, набор данных,</text>
  <text x="68" y="213" text-anchor="middle" font-size="11" fill="#475569">или гири</text>
  <circle cx="68" cy="228" r="4.5" fill="#dc2626"/>

  <rect x="144" y="164" width="96" height="76" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="192" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E">Хост сборки</text>
  <text x="192" y="200" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(192 0) scale(0.8363110376398779 1) translate(-192 0)" data-ru-fit="0.8363">импортирует его как</text>
  <text x="192" y="213" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(192 0) scale(0.9891124527328979 1) translate(-192 0)" data-ru-fit="0.9891">доверенный вход</text>
  <circle cx="192" cy="228" r="4.5" fill="#dc2626"/>

  <rect x="268" y="164" width="96" height="76" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="316" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E" transform=" translate(315.9700012207031 0) scale(0.8631725453334294 1) translate(-315.9700012207031 0)" data-ru-fit="0.8632">Учебное задание</text>
  <text x="316" y="200" text-anchor="middle" font-size="11" fill="#475569">каркас и</text>
  <text x="316" y="213" text-anchor="middle" font-size="11" fill="#475569" transform=" translate(316 0) scale(0.7610972424282503 1) translate(-316 0)" data-ru-fit="0.7611">конвейер поглотит это</text>
  <circle cx="316" cy="228" r="4.5" fill="#dc2626"/>

  <rect x="392" y="164" width="96" height="76" rx="2" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
  <text x="440" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#14294E" transform=" translate(439.96400451660156 0) scale(0.8027657523063852 1) translate(-439.96400451660156 0)" data-ru-fit="0.8028">Артефакт модели.</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#475569">отравлен или</text>
  <text x="440" y="213" text-anchor="middle" font-size="11" fill="#475569">с бэкдором</text>
  <circle cx="440" cy="228" r="4.5" fill="#dc2626"/>

  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M73,228 H142" marker-end="url(#arr-red)"/>
    <path d="M197,228 H266" marker-end="url(#arr-red)"/>
    <path d="M321,228 H390" marker-end="url(#arr-red)"/>
    <path d="M445,228 H514" marker-end="url(#arr-red)"/>
  </g>
  <path d="M488,181 H514" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr-gray)"/>

  <rect x="516" y="164" width="144" height="34" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="588" y="178" text-anchor="middle" font-size="12" fill="#334155" transform=" translate(588 0) scale(0.6424384525205158 1) translate(-588 0)" data-ru-fit="0.6424">Прохождение медицинского осмотра</text>
  <path d="M530,189 H646" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <rect x="516" y="206" width="144" height="34" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="588" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" transform=" translate(588 0) scale(0.8868135214699016 1) translate(-588 0)" data-ru-fit="0.8868">Модель плохо себя ведет</text>
  <path d="M530,231 L540,231 L545,225 L551,235 L557,224 L563,234 L569,226 L575,235 L581,223 L587,234 L593,225 L599,235 L605,224 L611,233 L617,226 L623,235 L629,224 L635,231 L646,231" stroke="#dc2626" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
