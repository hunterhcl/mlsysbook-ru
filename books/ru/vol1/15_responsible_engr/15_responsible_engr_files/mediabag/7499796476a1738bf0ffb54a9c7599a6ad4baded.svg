<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1811" viewBox="0 0 1000 1811" role="img" aria-label="Русская карточка набора Open Images Extended MIAP"><title>Карточка набора Open Images Extended MIAP</title><g font-family="Arial, DejaVu Sans, sans-serif"><rect width="1000" height="100%" fill="white"/><text x="28" y="38" font-size="25" font-weight="700" fill="#173d5c">Open Images Extended — карточка данных</text><text x="28" y="70" font-size="19" fill="#334155">Более полная разметка людей (MIAP)</text><rect x="20" y="112" width="960" height="38" rx="4" fill="#e8eff5"/><text x="32" y="137" font-size="19" font-weight="700" fill="#173d5c">О наборе</text><path d="M20 297 H980" stroke="#d3dde7"/><text x="32" y="180" font-size="15" font-weight="700" fill="#265b7e">Описание</text><text x="260" y="180" font-size="16" fill="#172431">Набор создан для исследований и оценки справедливости при обнаружении людей. Он</text><text x="260" y="203" font-size="16" fill="#172431">содержит 100,000 изображений из Open Images V6 с дополнительной разметкой:</text><text x="260" y="226" font-size="16" fill="#172431">координатами рамок каждого видимого человека, воспринимаемым гендерным</text><text x="260" y="249" font-size="16" fill="#172431">представлением и воспринимаемым возрастным диапазоном. Набор можно использовать</text><text x="260" y="272" font-size="16" fill="#172431">совместно с Open Images V6.</text><path d="M20 344 H980" stroke="#d3dde7"/><text x="32" y="319" font-size="15" font-weight="700" fill="#265b7e">Материалы</text><text x="260" y="319" font-size="16" fill="#172431">Загрузка набора данных; сопроводительная публикация.</text><rect x="20" y="344" width="960" height="38" rx="4" fill="#e8eff5"/><text x="32" y="369" font-size="19" font-weight="700" fill="#173d5c">Авторство</text><path d="M20 437 H980" stroke="#d3dde7"/><text x="32" y="412" font-size="15" font-weight="700" fill="#265b7e">Издатель</text><text x="260" y="412" font-size="16" fill="#172431">Google LLC</text><path d="M20 484 H980" stroke="#d3dde7"/><text x="32" y="459" font-size="15" font-weight="700" fill="#265b7e">Отрасль</text><text x="260" y="459" font-size="16" fill="#172431">Корпоративный сектор — технологии.</text><path d="M20 554 H980" stroke="#d3dde7"/><text x="32" y="506" font-size="15" font-weight="700" fill="#265b7e">Авторы набора</text><text x="260" y="506" font-size="16" fill="#172431">Candice Schumann; Susanna Ricco; Utsav Prabhu; Vittorio Ferrari; Caroline Pantofaru. Google,</text><text x="260" y="529" font-size="16" fill="#172431">2021.</text><path d="M20 601 H980" stroke="#d3dde7"/><text x="32" y="576" font-size="15" font-weight="700" fill="#265b7e">Финансирование</text><text x="260" y="576" font-size="16" fill="#172431">Частное финансирование.</text><path d="M20 648 H980" stroke="#d3dde7"/><text x="32" y="623" font-size="15" font-weight="700" fill="#265b7e">Контакт</text><text x="260" y="623" font-size="16" fill="#172431">open-images-extended@google.com</text><rect x="20" y="648" width="960" height="38" rx="4" fill="#e8eff5"/><text x="32" y="673" font-size="19" font-weight="700" fill="#173d5c">Мотивы и назначение</text><path d="M20 741 H980" stroke="#d3dde7"/><text x="32" y="716" font-size="15" font-weight="700" fill="#265b7e">Назначение</text><text x="260" y="716" font-size="16" fill="#172431">Исследования; машинное обучение; обучение, тестирование и валидация.</text><path d="M20 788 H980" stroke="#d3dde7"/><text x="32" y="763" font-size="15" font-weight="700" fill="#265b7e">Основные применения</text><text x="260" y="763" font-size="16" fill="#172431">Машинное обучение; распознавание объектов; справедливость машинного обучения.</text><path d="M20 858 H980" stroke="#d3dde7"/><text x="32" y="810" font-size="15" font-weight="700" fill="#265b7e">Проблемная область</text><text x="260" y="810" font-size="16" fill="#172431">Исследования и оценка справедливости при обнаружении людей. Подробности приведены в</text><text x="260" y="833" font-size="16" fill="#172431">сопроводительной статье.</text><path d="M20 928 H980" stroke="#d3dde7"/><text x="32" y="880" font-size="15" font-weight="700" fill="#265b7e">Основные мотивы</text><text x="260" y="880" font-size="16" fill="#172431">Более полная эталонная разметка рамок людей. Стандартный набор для оценки</text><text x="260" y="903" font-size="16" fill="#172431">справедливости, доступный исследовательскому сообществу.</text><path d="M20 1044 H980" stroke="#d3dde7"/><text x="32" y="950" font-size="15" font-weight="700" fill="#265b7e">Подходящие сценарии</text><text x="260" y="950" font-size="16" fill="#172431">Оценка моделей: обнаружение людей и оценка справедливости. Обучение моделей:</text><text x="260" y="973" font-size="16" fill="#172431">обнаружение людей и объектов. Обнаружение людей без определения гендера или возраста;</text><text x="260" y="996" font-size="16" fill="#172431">оценка справедливости по группам воспринимаемого гендера и возраста; исследования</text><text x="260" y="1019" font-size="16" fill="#172431">справедливости без построения классификаторов гендера или возраста.</text><rect x="20" y="1044" width="960" height="38" rx="4" fill="#e8eff5"/><text x="32" y="1069" font-size="19" font-weight="700" fill="#173d5c">Использование набора</text><path d="M20 1137 H980" stroke="#d3dde7"/><text x="32" y="1112" font-size="15" font-weight="700" fill="#265b7e">Безопасность</text><text x="260" y="1112" font-size="16" fill="#172431">Условно безопасное использование: известны небезопасные применения.</text><path d="M20 1184 H980" stroke="#d3dde7"/><text x="32" y="1159" font-size="15" font-weight="700" fill="#265b7e">Небезопасные приложения</text><text x="260" y="1159" font-size="16" fill="#172431">Классификация гендера; классификация возраста.</text><path d="M20 1300 H980" stroke="#d3dde7"/><text x="32" y="1206" font-size="15" font-weight="700" fill="#265b7e">Небезопасные сценарии</text><text x="260" y="1206" font-size="16" fill="#172431">Набор не следует использовать для создания классификаторов гендера или возраста. Метки</text><text x="260" y="1229" font-size="16" fill="#172431">отражают представление о гендере и возрасте, которое третье лицо формирует только по</text><text x="260" y="1252" font-size="16" fill="#172431">визуальным признакам. Они не отражают самоидентификацию человека или его фактический</text><text x="260" y="1275" font-size="16" fill="#172431">возраст.</text><path d="M20 1370 H980" stroke="#d3dde7"/><text x="32" y="1322" font-size="15" font-weight="700" fill="#265b7e">Совместное использование</text><text x="260" y="1322" font-size="16" fill="#172431">Безопасно совместное использование с другими наборами; известный совместимый набор —</text><text x="260" y="1345" font-size="16" fill="#172431">Open Images V6.</text><path d="M20 1440 H980" stroke="#d3dde7"/><text x="32" y="1392" font-size="15" font-weight="700" fill="#265b7e">Известные совместные</text><text x="32" y="1415" font-size="15" font-weight="700" fill="#265b7e">применения</text><text x="260" y="1392" font-size="16" fill="#172431">Анализ рамок, не размеченных по исходной процедуре Open Images V6.</text><rect x="20" y="1440" width="960" height="38" rx="4" fill="#e8eff5"/><text x="32" y="1465" font-size="19" font-weight="700" fill="#173d5c">Методы и оговорки</text><path d="M20 1533 H980" stroke="#d3dde7"/><text x="32" y="1508" font-size="15" font-weight="700" fill="#265b7e">Обнаружение объектов</text><text x="260" y="1508" font-size="16" fill="#172431">Детектор людей можно обучить с помощью Object Detection API в TensorFlow.</text><path d="M20 1649 H980" stroke="#d3dde7"/><text x="32" y="1555" font-size="15" font-weight="700" fill="#265b7e">Оговорка к обнаружению</text><text x="260" y="1555" font-size="16" fill="#172431">При совместном использовании с исходным Open Images отрицательные примеры людей</text><text x="260" y="1578" font-size="16" fill="#172431">следует брать только из изображений с явной отрицательной меткой наличия человека на</text><text x="260" y="1601" font-size="16" fill="#172431">уровне изображения. Набор не содержит изображений, которые исходная процедура Open</text><text x="260" y="1624" font-size="16" fill="#172431">Images не пометила как содержащие хотя бы одного человека.</text><path d="M20 1719 H980" stroke="#d3dde7"/><text x="32" y="1671" font-size="15" font-weight="700" fill="#265b7e">Оценка справедливости</text><text x="260" y="1671" font-size="16" fill="#172431">Оценку можно проводить по группам воспринимаемого гендерного представления и</text><text x="260" y="1694" font-size="16" fill="#172431">возрастного представления.</text><path d="M20 1789 H980" stroke="#d3dde7"/><text x="32" y="1741" font-size="15" font-weight="700" fill="#265b7e">Оговорка к справедливости</text><text x="260" y="1741" font-size="16" fill="#172431">Сохраняется перекос гендерного представления в сторону неизвестного и преимущественно</text><text x="260" y="1764" font-size="16" fill="#172431">маскулинного, а возрастного представления — в сторону среднего диапазона.</text></g></svg>