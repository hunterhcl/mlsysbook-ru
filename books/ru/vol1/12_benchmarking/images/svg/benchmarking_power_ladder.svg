<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 180 126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Техническое описание TOPS/Вт в 13.3 раза превышает устойчивое значение TOPS/Вт.">
  <rect x="0" y="0" width="180" height="126" fill="#ffffff"/>
  <!-- linear TOPS/W scale: datasheet 10/0.5 = 20, sustained 3/2 = 1.5 ; 8.6 px per TOPS/W -->
  <text x="90" y="14" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">TOPS/W</text>
  <rect x="4" y="22" width="172" height="36" fill="#e67817"/>
  <text x="170" y="37" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">Технический паспорт</text>
  <text x="170" y="52" font-size="12" fill="#ffffff" text-anchor="end">10 TOPS при 0.5 Вт</text>
  <!-- dimension arrow between the two bar ends -->
  <path d="M17 72 H176" stroke="#777777" stroke-width="1.2" fill="none"/>
  <path d="M22 68.5 L16.5 72 L22 75.5" stroke="#777777" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M171 68.5 L176.5 72 L171 75.5" stroke="#777777" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <rect x="76" y="64" width="40" height="16" fill="#ffffff"/>
  <text x="96" y="76.5" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">13.3×</text>
  <rect x="4" y="84" width="12.9" height="36" fill="#e67817"/>
  <text x="22" y="99" font-size="12" font-weight="bold" fill="#333333" transform=" translate(21.940000534057617 0) scale(0.7808398838831607 1) translate(-21.940000534057617 0)" data-ru-fit="0.7808">Устойчивый</text>
  <text x="22" y="114" font-size="12" fill="#333333" transform=" translate(22 0) scale(0.8599939733632549 1) translate(-22 0)" data-ru-fit="0.8600">3 TOPS при 2 Вт</text>
<metadata id="original-source-labels">Datasheet TOPS/W is 13.3 times the sustained TOPS/W.
