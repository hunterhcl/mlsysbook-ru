  <path d="M296,149 H350 C380,148 410,118 430,76" fill="none" stroke="#B87333" stroke-width="2"/>
  <path d="M430,76 C443,70 457,72 470,80" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M470,80 C478,112 486,112 494,92 C502,72 510,86 518,106 C526,124 534,112 542,104 C546,101 548,104 550,108" fill="none" stroke="#718096" stroke-width="1.6"/>
  <path d="M550,108 C572,130 600,147 630,149 H658" fill="none" stroke="#1A202C" stroke-width="2"/>
  <circle cx="430" cy="76" r="3" fill="#1A202C"/>
  <text x="404" y="104" font-size="8.5" fill="#B87333" text-anchor="end" transform=" translate(404 0) scale(0.9565217391304348 1) translate(-404 0)" data-ru-fit="0.9565">ученик</text>
  <text x="592" y="124" font-size="8.5" fill="#1A202C" transform=" translate(592 0) scale(0.7569955817378498 1) translate(-592 0)" data-ru-fit="0.7570">эксперт</text>

  <text x="350" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">div</tspan></text>
  <text x="430" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">takeover</tspan></text>
  <text x="550" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">stabilize</tspan></text>
  <text x="630" y="164" font-size="9" fill="#1A202C" text-anchor="middle">t<tspan dy="2.5" font-size="7.5">rec</tspan></text>

  <!-- interval names (the four intervals of the authority record) -->
  <text x="343" y="190" font-size="8.5" fill="#4A5568" text-anchor="end" transform=" translate(343 0) scale(0.7390387858347386 1) translate(-343 0)" data-ru-fit="0.7390">интервал</text>
  <text x="390" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(390 0) scale(0.5699821322215605 1) translate(-390 0)" data-ru-fit="0.5700">дрейф</text>
  <text x="450" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(450 0) scale(0.5287490287490287 1) translate(-450 0)" data-ru-fit="0.5287">смешение</text>
  <text x="510" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(510 0) scale(0.4899904671115348 1) translate(-510 0)" data-ru-fit="0.4900">переориентация</text>
  <text x="590" y="190" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(590 0) scale(0.6481376975169301 1) translate(-590 0)" data-ru-fit="0.6481">стабилизация</text>

  <!-- states row -->
  <text x="343" y="210" font-size="8.5" fill="#4A5568" text-anchor="end" transform=" translate(343 0) scale(0.5536319156943922 1) translate(-343 0)" data-ru-fit="0.5536">состояния</text>
  <rect x="350" y="198" width="80" height="18" rx="0" fill="#E3F3F5" stroke="#007A87" stroke-width="1"/>
  <text x="390" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(390 0) scale(0.7423445716053202 1) translate(-390 0)" data-ru-fit="0.7423">допустима переразметка</text>
  <rect x="430" y="198" width="120" height="18" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
  <line x1="470" y1="198" x2="470" y2="216" stroke="#4A5568" stroke-width="0.8"/>
  <rect x="484" y="201" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="510" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle">исключено</text>
  <rect x="550" y="198" width="80" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="590" y="210" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(590 0) scale(0.6835659356308744 1) translate(-590 0)" data-ru-fit="0.6836">восстановление экспертом</text>

  <!-- commands row -->
  <text x="343" y="234" font-size="8.5" fill="#4A5568" text-anchor="end">команды</text>
  <rect x="350" y="222" width="200" height="18" rx="0" fill="url(#hatch)" stroke="#4A5568" stroke-width="1"/>
  <line x1="430" y1="222" x2="430" y2="240" stroke="#4A5568" stroke-width="0.8"/>
  <line x1="470" y1="222" x2="470" y2="240" stroke="#4A5568" stroke-width="0.8"/>
  <rect x="366" y="225" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="390" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(390 0) scale(0.8115600117959304 1) translate(-390 0)" data-ru-fit="0.8116">маскировано</text>
  <rect x="486" y="225" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="510" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle" transform=" translate(510 0) scale(0.8115600117959304 1) translate(-510 0)" data-ru-fit="0.8116">маскировано</text>
  <rect x="550" y="222" width="80" height="18" rx="0" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1"/>
  <text x="590" y="234" font-size="8.5" fill="#1A202C" text-anchor="middle">метки эксперта</text>
