<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1A202C"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A5568"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F1F3F6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#A0AEC0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="680" height="262" fill="#ffffff"/>

  <!-- ===== Left panel: closed loop and bound orders ===== -->
  <text x="130" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(130 0) scale(0.6505742651352929 1) translate(-130 0)" data-ru-fit="0.6506">(a) Обучаемая модель в контуре</text>

  <rect x="70" y="34" width="120" height="32" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1"/>
  <text x="130" y="54" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Обученная политика</text>

  <rect x="70" y="150" width="120" height="32" rx="0" fill="#F8FAFC" stroke="#4A5568" stroke-width="1"/>
  <text x="130" y="170" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Объект управления</text>

  <rect x="70" y="212" width="120" height="26" rx="0" fill="#ffffff" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="229" font-size="8.5" fill="#4A5568" text-anchor="middle">возмущение</text>

  <!-- loop: policy -> action -> plant -> state -> policy -->
  <path d="M190,50 H222 V166 H192" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <path d="M70,166 H40 V50 H68" fill="none" stroke="#1A202C" stroke-width="1.3" marker-end="url(#arr-ink)"/>
  <line x1="130" y1="212" x2="130" y2="184" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="228" y="112" font-size="9" fill="#4A5568" transform=" translate(228 0) scale(0.632358830596716 1) translate(-228 0)" data-ru-fit="0.6324">действие</text>
  <text x="34" y="112" font-size="9" fill="#4A5568" text-anchor="end" transform=" translate(34 0) scale(0.4513148542999289 1) translate(-34 0)" data-ru-fit="0.4513">состояние</text>

  <!-- bound orders -->
  <text x="130" y="94" font-size="8.5" fill="#4A5568" text-anchor="middle" transform=" translate(130 0) scale(0.6257106491302503 1) translate(-130 0)" data-ru-fit="0.6257">поведенческое клонирование, худший случай</text>
  <text x="130" y="108" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">𝒪(S²ε)</text>
  <text x="130" y="126" font-size="8.5" fill="#4A5568" text-anchor="middle" transform=" translate(130 0) scale(0.7312220868859115 1) translate(-130 0)" data-ru-fit="0.7312">агрегация, восстанавливаемая задача</text>
  <text x="130" y="140" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">𝒪(uSε)</text>

  <!-- ===== Right panel: curation timeline ===== -->
  <text x="478" y="20" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(478 0) scale(0.681906272022551 1) translate(-478 0)" data-ru-fit="0.6819">(b) Отбор данных одного перехвата</text>

  <!-- lookback bracket: 5 s back from takeover, past t_div -->
  <path d="M330,52 V46 H430 V52" fill="none" stroke="#4A5568" stroke-width="1"/>
  <text x="346" y="40" font-size="9" fill="#1A202C">Δt<tspan dy="2.5" font-size="7.5">lookback</tspan></text>
  <text x="390" y="40" font-size="9" fill="#1A202C">= 5 s</text>

  <!-- event markers: t_div 350, t_takeover 430, blend end 470, t_stabilize 550, t_rec 630 -->
  <g stroke="#A0AEC0" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="350" y1="58" x2="350" y2="150"/>
    <line x1="430" y1="58" x2="430" y2="150"/>
    <line x1="470" y1="58" x2="470" y2="150"/>
    <line x1="550" y1="58" x2="550" y2="150"/>
    <line x1="630" y1="58" x2="630" y2="150"/>
  </g>

  <!-- axes -->
  <line x1="296" y1="150" x2="668" y2="150" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <line x1="296" y1="150" x2="296" y2="60" stroke="#4A5568" stroke-width="1" marker-end="url(#arr-soft)"/>
  <text x="0" y="0" font-size="8.5" fill="#4A5568" text-anchor="end" transform="translate(290,62) rotate(-90) translate(0 0) scale(0.7062921837578925 1) translate(0 0)" data-ru-fit="0.7063">ошибка слежения</text>
  <text x="668" y="140" font-size="8.5" fill="#4A5568" text-anchor="end" transform=" translate(668 0) scale(0.6660317460317461 1) translate(-668 0)" data-ru-fit="0.6660">время</text>

