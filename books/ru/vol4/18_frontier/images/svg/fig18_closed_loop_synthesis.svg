<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="426" fill="#ffffff"/>
  <defs>
    <marker id="arr-proposal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-measured" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Governance envelope: surrounds all five levels, no control rate ===== -->
  <rect x="36" y="16" width="608" height="394" rx="4" fill="none" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="52" y="36" font-size="9.5" font-weight="700" fill="#1A202C" transform=" translate(51.95249938964844 0) scale(0.8441111740598893 1) translate(-51.95249938964844 0)" data-ru-fit="0.8441">Управление<tspan dx="6" font-weight="400" font-size="8.5" fill="#4A5568">кто вправе командовать, на каком основании, до какого срока · без частоты управления</tspan></text>

  <!-- ===== Proposal boundary (drawn under the arrows that cross it) ===== -->
  <line x1="44" y1="112" x2="636" y2="112" stroke="#4A5568" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="300" y="103" width="170" height="18" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="0.8"/>
  <text x="385" y="115.5" text-anchor="middle" font-size="9" font-weight="700" font-style="italic" fill="#4A5568">граница предложений</text>

  <!-- ===== Brain (proposal role) ===== -->
  <rect x="70" y="50" width="440" height="44" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="86" y="67" font-size="10.5" font-weight="700" fill="#1A202C">Мозг</text>
  <text x="86" y="83" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(86 0) scale(0.9859649122807017 1) translate(-86 0)" data-ru-fit="0.9860">обученные генераторы · модель намерений 2 Hz (инференс 336 ms) · продление фрагмента каждые 50 ms</text>

  <!-- ===== Nervous System (structural role): application processor + discrete safety MCU ===== -->
  <rect x="70" y="130" width="440" height="78" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="147" font-size="10.5" font-weight="700" fill="#1A202C">Нервная система</text>
  <text x="494" y="147" text-anchor="end" font-size="8.5" font-weight="400" fill="#4A5568">допустить, изменить или отклонить · срок допуска · резервный режим</text>
  <rect x="86" y="156" width="160" height="42" rx="3" fill="#ffffff" stroke="#1A4D3E" stroke-width="1"/>
  <text x="166" y="173" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">прикладной процессор</text>
  <text x="166" y="188" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">уставка каждые 25 ms</text>
  <rect x="326" y="156" width="168" height="42" rx="3" fill="#ffffff" stroke="#1A4D3E" stroke-width="1"/>
  <text x="410" y="173" text-anchor="middle" font-size="9" font-weight="700" fill="#1A202C">отдельный МК безопасности</text>
  <text x="410" y="188" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">контур допуска · такт 1 kHz</text>
  <!-- black-channel link: no shared memory -->
  <line x1="246" y1="184" x2="324" y2="184" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="285" y="170" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">канал без доверия</text>
  <text x="285" y="179" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">канал</text>

  <!-- ===== Body (structural role) ===== -->
  <rect x="70" y="226" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="243" font-size="10.5" font-weight="700" fill="#1A202C">Тело</text>
  <text x="86" y="259" font-size="8.5" font-weight="400" fill="#4A5568">приводы замыкают контуры тока на 20 kHz · передача, обмотки · шина приводов 47.7 V</text>

  <!-- ===== Boundary (structural role) ===== -->
  <rect x="70" y="288" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="305" font-size="10.5" font-weight="700" fill="#1A202C">Граница</text>
  <text x="86" y="321" font-size="8.5" font-weight="400" fill="#4A5568">запись в регистр исполнительного механизма и захват данных с датчика · по событию</text>

  <!-- ===== World (measured role) ===== -->
  <rect x="70" y="350" width="440" height="44" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="86" y="367" font-size="10.5" font-weight="700" fill="#1A202C">Мир</text>
  <text x="86" y="383" font-size="8.5" font-weight="400" fill="#4A5568">контакт, трение, полезная нагрузка, люди · непрерывно · не каждое состояние достигает датчика</text>

  <!-- ===== Downward path: proposal to physical work ===== -->
  <line x1="200" y1="94" x2="200" y2="154" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-proposal)"/>
  <text x="208" y="107" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(208 0) scale(0.6116225546605294 1) translate(-208 0)" data-ru-fit="0.6116">предложение</text>
  <line x1="410" y1="198" x2="410" y2="224" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="418" y="219" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(418 0) scale(0.869041095890411 1) translate(-418 0)" data-ru-fit="0.8690">допущенная команда</text>
  <line x1="200" y1="270" x2="200" y2="286" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="208" y="282" font-size="8.5" font-weight="400" fill="#4A5568">ток в обмотке</text>
  <line x1="200" y1="332" x2="200" y2="348" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="208" y="344" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(208 0) scale(0.9490124023886082 1) translate(-208 0)" data-ru-fit="0.9490">сила и движение</text>

  <!-- ===== Upward path: the World measured at the Boundary ===== -->
  <line x1="420" y1="350" x2="420" y2="334" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="412" y="344" text-anchor="end" font-size="8.5" font-weight="400" fill="#4A5568">свет и сила</text>

  <!-- Perimeter feedback lane: measurements with capture time -->
  <path d="M 510 310 H 580 V 72 H 512" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <line x1="580" y1="177" x2="496" y2="177" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="545" y="305" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">захват</text>
  <text x="545" y="172" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(545 0) scale(0.4466631634261692 1) translate(-545 0)" data-ru-fit="0.4467">актуальное состояние</text>
  <text x="545" y="67" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568" transform=" translate(545 0) scale(0.990802410402791 1) translate(-545 0)" data-ru-fit="0.9908">наблюдения</text>
<metadata id="original-source-labels">Governance
who may command, what licenses operation, when it expires · no control rate
proposal boundary
Brain
learned proposers · intent model 2 Hz (336 ms inference) · chunk renewed every 50 ms
Nervous System
admit, modify, or refuse · lease · fallback
application processor
setpoint every 25 ms
discrete safety MCU
permission path · 1 kHz tick
black-channel
link
Body
drives close current loops at 20 kHz · gearing, windings · 47.7 V drive bus
Boundary
actuator register write and sensor capture · event-timed
World
contact, friction, payload, people · continuous · not every state reaches a sensor
proposal
admitted command
current in a winding
force and motion
light and force
capture
fresh state
observations</metadata></svg>