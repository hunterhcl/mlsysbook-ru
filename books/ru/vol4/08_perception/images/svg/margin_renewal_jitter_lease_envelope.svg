  <text x="178" y="14" font-size="13" fill="#cb202d" text-anchor="end" transform=" translate(178 0) scale(0.5819171307154873 1) translate(-178 0)" data-ru-fit="0.5819">60: истечение</text>
  <text x="105" y="83" font-size="13" fill="#333333" text-anchor="middle" transform=" translate(105 0) scale(0.7267994314841527 1) translate(-105 0)" data-ru-fit="0.7268">10 ms поздно</text>
