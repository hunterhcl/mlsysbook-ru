<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 680 260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/>
    </marker>
  </defs>
  <rect x="0" y="50" width="680" height="260" fill="#ffffff"/>

  <!-- ===== Superstate: lease held, timer armed ===== -->
  <rect x="160" y="60" width="290" height="130" rx="4" fill="#1A4D3E" fill-opacity="0.05" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="170" y="182" font-size="8.5" font-weight="700" fill="#1A4D3E">допуск действует · таймер запущен</text>

  <!-- Pending -->
  <rect x="20" y="115" width="100" height="36" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="70" y="137" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Ожидается</text>
  <line x1="120" y1="133" x2="178" y2="133" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <text x="139" y="126" font-size="8.5" fill="#1A4D3E" text-anchor="middle" transform=" translate(139 0) scale(0.8409356725146199 1) translate(-139 0)" data-ru-fit="0.8409">допущено</text>
  <line x1="70" y1="151" x2="70" y2="226" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-slate)"/>
  <text x="78" y="196" font-size="8.5" fill="#4A5568" transform=" translate(78 0) scale(0.6933662667607622 1) translate(-78 0)" data-ru-fit="0.6934">отклонено:</text>
  <text x="78" y="208" font-size="8.5" fill="#4A5568" transform=" translate(78 0) scale(0.7016011644832606 1) translate(-78 0)" data-ru-fit="0.7016">нет полномочий</text>
  <circle cx="70" cy="234" r="6" fill="#ffffff" stroke="#4A5568" stroke-width="1.2"/>
  <circle cx="70" cy="234" r="3" fill="#4A5568"/>

  <!-- Active -->
  <rect x="180" y="115" width="100" height="36" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="230" y="137" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Активен</text>
  <!-- stale renewal self-loop -->
  <path d="M 215 115 V 96 H 245 V 113" fill="none" stroke="#4A5568" stroke-width="1.1" marker-end="url(#arr-slate)"/>
  <text x="230" y="88" font-size="8.5" fill="#4A5568" text-anchor="middle" transform=" translate(230 0) scale(0.9693705822955234 1) translate(-230 0)" data-ru-fit="0.9694">устаревшее продление: отклонено</text>

  <!-- Renewed -->
  <line x1="280" y1="133" x2="338" y2="133" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <text x="309" y="126" font-size="8.5" fill="#1A4D3E" text-anchor="middle">продление</text>
  <rect x="340" y="115" width="100" height="36" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="390" y="137" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Продлён</text>
  <path d="M 375 115 V 96 H 405 V 113" fill="none" stroke="#1A4D3E" stroke-width="1.1" marker-end="url(#arr-pine)"/>
  <text x="390" y="80" font-size="8.5" fill="#1A4D3E" text-anchor="middle">продление: больший номер,</text>
  <text x="390" y="91" font-size="8.5" fill="#1A4D3E" text-anchor="middle">новый захват, проверка</text>

  <!-- Goal complete -->
  <line x1="450" y1="133" x2="538" y2="133" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
  <text x="494" y="115" font-size="8.5" fill="#4A5568" text-anchor="middle" transform=" translate(494 0) scale(0.7932300163132137 1) translate(-494 0)" data-ru-fit="0.7932">терминал</text>
  <text x="494" y="126" font-size="8.5" fill="#4A5568" text-anchor="middle" transform=" translate(494 0) scale(0.6263812154696132 1) translate(-494 0)" data-ru-fit="0.6264">предикаты выполнены</text>
  <rect x="540" y="115" width="110" height="36" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="595" y="137" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">цель достигнута</text>

  <!-- Expired -->
  <line x1="230" y1="190" x2="230" y2="238" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="237" y="212" font-size="8.5" fill="#A51C30" transform=" translate(237 0) scale(0.7253521126760564 1) translate(-237 0)" data-ru-fit="0.7254">таймер достигает</text>
  <text x="237" y="224" font-size="8.5" fill="#A51C30">t<tspan baseline-shift="sub" font-size="75%">intent_exp</tspan></text>
  <rect x="180" y="240" width="100" height="36" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="230" y="262" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(230.0284881591797 0) scale(0.9422547284264261 1) translate(-230.0284881591797 0)" data-ru-fit="0.9423">Срок действия истек</text>

  <!-- Aborted -->
  <line x1="390" y1="190" x2="390" y2="238" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <text x="397" y="212" font-size="8.5" fill="#A51C30" transform=" translate(397 0) scale(0.680037488284911 1) translate(-397 0)" data-ru-fit="0.6800">предел контакта или</text>
  <text x="397" y="224" font-size="8.5" fill="#A51C30" transform=" translate(397 0) scale(0.5074202715503631 1) translate(-397 0)" data-ru-fit="0.5074">свидетельства утрачены</text>
  <rect x="340" y="240" width="100" height="36" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="390" y="262" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">Прервано</text>

  <!-- Validated fallback -->
  <rect x="540" y="240" width="110" height="36" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1.3"/>
  <text x="595" y="262" font-size="9.5" font-weight="700" fill="#A51C30" text-anchor="middle" transform=" translate(595 0) scale(0.6845556145694687 1) translate(-595 0)" data-ru-fit="0.6846">проверенный резервный режим</text>
  <line x1="440" y1="258" x2="538" y2="258" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-red)"/>
  <path d="M 230 276 V 294 H 595 V 278" fill="none" stroke="#A51C30" stroke-width="1.3" marker-end="url(#arr-red)"/>
