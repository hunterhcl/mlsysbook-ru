<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B87333"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B4B8A"/>
    </marker>
  </defs>
  <rect width="680" height="345" fill="#ffffff"/>

  <!-- Domain headers and the processor boundary -->
  <text x="230" y="24" font-size="10" font-weight="700" fill="#4A5568" text-anchor="middle" letter-spacing="0.6" transform=" translate(230 0) scale(0.9512081473214286 1) translate(-230 0)" data-ru-fit="0.9512">ПРИКЛАДНОЙ ПРОЦЕССОР</text>
  <text x="552" y="24" font-size="10" font-weight="700" fill="#4A5568" text-anchor="middle" letter-spacing="0.6" transform=" translate(552 0) scale(0.7300544697212432 1) translate(-552 0)" data-ru-fit="0.7301">МК безопасности</text>
  <line x1="458" y1="34" x2="458" y2="335" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Inputs (measured) -->
  <rect x="20" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="60" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">изображение I<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
  <rect x="115" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="155" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">инструкция</text>
  <rect x="210" y="40" width="80" height="30" rx="3" fill="#E0F0F2" stroke="#007A87" stroke-width="1.2"/>
  <text x="250" y="59" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">состояние q, q̇</text>
  <line x1="60" y1="70" x2="60" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="155" y1="70" x2="155" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <line x1="250" y1="70" x2="250" y2="98" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <!-- Intent model (proposal) -->
  <rect x="20" y="100" width="270" height="46" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="155" y="119" font-size="10" font-weight="700" fill="#1A202C" text-anchor="middle">модель намерений (VLA)</text>
  <text x="155" y="136" font-size="8.5" fill="#4A5568" text-anchor="middle">инференс 336 ms · частота 2 Hz</text>
  <line x1="155" y1="146" x2="155" y2="170" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>

  <!-- 3D cost field -->
  <rect x="20" y="172" width="270" height="34" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.3"/>
  <text x="155" y="193" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">3D-поле стоимости U(x), кандидат цели</text>
  <line x1="290" y1="189" x2="310" y2="189" stroke="#B87333" stroke-width="1.2" marker-end="url(#arr-bronze)"/>

  <!-- Ambiguity gate -->
  <path d="M 360 159 L 408 189 L 360 219 L 312 189 Z" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="360" y="186" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(360 0) scale(0.5218476634438306 1) translate(-360 0)" data-ru-fit="0.5218">двусмысленность</text>
  <text x="360" y="199" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle">| 𝒞 | = 1 ?</text>

  <!-- No: refusal -->
  <line x1="360" y1="219" x2="360" y2="252" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>
  <text x="367" y="240" font-size="8.5" fill="#4A5568" transform=" translate(367 0) scale(0.7243816254416962 1) translate(-367 0)" data-ru-fit="0.7244">нет</text>
  <rect x="305" y="254" width="110" height="30" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2"/>
  <text x="360" y="273" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(360 0) scale(0.8024958003359731 1) translate(-360 0)" data-ru-fit="0.8025">отказ привязки к объектам</text>

  <!-- Yes: proposal record over the board link -->
  <line x1="408" y1="189" x2="492" y2="189" stroke="#B87333" stroke-width="1.4" marker-end="url(#arr-bronze)"/>
  <text x="418" y="203" font-size="8.5" fill="#4A5568">да</text>
  <rect x="388" y="136" width="104" height="34" rx="3" fill="#ffffff" stroke="none"/>
  <text x="440" y="150" font-size="8.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(440 0) scale(0.7808725659354203 1) translate(-440 0)" data-ru-fit="0.7809">межплатный канал (SPI, DMA)</text>
  <text x="440" y="164" font-size="8" fill="#4A5568" text-anchor="middle">CRC · номер · срок</text>

  <!-- MCU: mailbox, permission path, drives -->
  <rect x="494" y="172" width="120" height="34" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="554" y="186" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">почтовый ящик</text>
  <text x="554" y="199" font-size="8" fill="#4A5568" text-anchor="middle">MCU SRAM, двойной буфер</text>
  <line x1="554" y1="206" x2="554" y2="230" stroke="#4A5568" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="494" y="232" width="120" height="40" rx="3" fill="#E6EEEB" stroke="#1A4D3E" stroke-width="1.4"/>
  <text x="554" y="249" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">контур допуска</text>
  <text x="554" y="264" font-size="8.5" fill="#1A4D3E" text-anchor="middle">такт 1 kHz</text>
  <line x1="554" y1="272" x2="554" y2="296" stroke="#1A4D3E" stroke-width="1.2" marker-end="url(#arr-slate)"/>

  <rect x="509" y="298" width="90" height="28" rx="0" fill="#ffffff" stroke="#2D3748" stroke-width="1.3"/>
  <text x="554" y="316" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(554 0) scale(0.9666943735446892 1) translate(-554 0)" data-ru-fit="0.9667">приводы суставов</text>

  <!-- Lease timer (authority), armed by admission -->
  <rect x="494" y="100" width="120" height="46" rx="3" fill="#ECE9F3" stroke="#5B4B8A" stroke-width="1.3"/>
  <text x="554" y="119" font-size="9.5" font-weight="700" fill="#1A202C" text-anchor="middle">таймер допуска</text>
  <text x="554" y="135" font-size="8.5" fill="#5B4B8A" text-anchor="middle">отсчитывается до t<tspan baseline-shift="sub" font-size="75%">exp</tspan></text>
  <path d="M 614 252 L 626 252 L 626 130 L 618 130" fill="none" stroke="#5B4B8A" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="621" y="222" font-size="8" fill="#5B4B8A" text-anchor="end">руки</text>
  <path d="M 614 112 L 646 112 L 646 312 L 603 312" fill="none" stroke="#A51C30" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="656" y="212" font-size="8.5" font-weight="700" fill="#A51C30" text-anchor="middle" transform="rotate(90, 656, 212) translate(656 0) scale(0.6190823901667275 1) translate(-656 0)" data-ru-fit="0.6191">истечение допуска → останов</text>
