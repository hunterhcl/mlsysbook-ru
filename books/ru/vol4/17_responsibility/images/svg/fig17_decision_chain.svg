<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="800" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="arr-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#DC2626"/></marker>
  </defs>

  <!-- Column heads -->
  <text x="90" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle" transform=" translate(90 0) scale(0.717400957236516 1) translate(-90 0)" data-ru-fit="0.7174">В одном такте</text>
  <text x="330" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle" transform=" translate(330 0) scale(0.9696307625081931 1) translate(-330 0)" data-ru-fit="0.9696">Решение и кто его принял</text>
  <text x="535" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle" transform=" translate(535 0) scale(0.7551696561179024 1) translate(-535 0)" data-ru-fit="0.7552">Запись с этим решением</text>
  <text x="705" y="24" font-size="11" font-weight="700" fill="#1A4D3E" text-anchor="middle" transform=" translate(705 0) scale(0.4660779135028062 1) translate(-705 0)" data-ru-fit="0.4661">Зафиксированный ответственный</text>

  <!-- Admitted command -->
  <rect x="20" y="156" width="140" height="62" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="90" y="179" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">допущенная в проходе</text>
  <text x="90" y="193" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">команда</text>
  <text x="90" y="209" font-size="10.5" fill="#4A5568" text-anchor="middle">1.3 m/s, один такт</text>

  <!-- Fan from the command to six decisions -->
  <path d="M160,187 L200,187 L200,61 L234,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,113 L234,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,165 L234,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,217 L234,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,187 L200,321 L234,321" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M200,269 L234,269" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Six decisions (x 235..425), rows centered at 61, 113, 165, 217, 269, 321 -->
  <rect x="235" y="40" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="57" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">веса политики</text>
  <text x="330" y="72" font-size="10.5" fill="#4A5568" text-anchor="middle">команда обучения</text>

  <rect x="235" y="92" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="109" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(330 0) scale(0.8680612018626653 1) translate(-330 0)" data-ru-fit="0.8681">версия контроллера допуска и пороги</text>
  <text x="330" y="124" font-size="10.5" fill="#4A5568" text-anchor="middle">инженеры по безопасности</text>

  <rect x="235" y="144" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="161" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">состояние полномочий</text>
  <text x="330" y="176" font-size="10.5" fill="#4A5568" text-anchor="middle" transform=" translate(330 0) scale(0.8475391286027399 1) translate(-330 0)" data-ru-fit="0.8475">проектирование вмешательства, помощник</text>

  <rect x="235" y="196" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="213" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">рабочая допустимая область</text>
  <text x="330" y="228" font-size="10.5" fill="#4A5568" text-anchor="middle">ответственный системный эксперт</text>

  <rect x="235" y="248" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="265" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">правило пересечения</text>
  <text x="330" y="280" font-size="10.5" fill="#4A5568" text-anchor="middle">управление объектом</text>

  <rect x="235" y="300" width="190" height="42" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="330" y="317" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">число машин на сотрудника</text>
  <text x="330" y="332" font-size="10.5" fill="#4A5568" text-anchor="middle">эксплуатация</text>

  <!-- Decision to record -->
  <path d="M425,61 L469,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,113 L469,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,165 L469,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,217 L469,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M425,269 L469,269" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <path d="M425,321 L469,321" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Records (x 470..600) -->
  <rect x="470" y="44" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="65" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">манифест политики</text>
  <rect x="470" y="96" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="117" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle" transform=" translate(535 0) scale(0.8829311885612153 1) translate(-535 0)" data-ru-fit="0.8829">запись контроля допуска</text>
  <rect x="470" y="148" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="169" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">запись полномочий</text>
  <rect x="470" y="200" width="130" height="34" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="535" y="221" font-size="11" font-weight="700" fill="#1A202C" text-anchor="middle">манифест выпуска</text>
  <rect x="470" y="252" width="130" height="34" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="535" y="273" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">нет записи</text>
  <rect x="470" y="304" width="130" height="34" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="535" y="325" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">нет записи</text>

  <!-- Into the approval record -->
  <path d="M600,61 L626,61" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,113 L626,113" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,165 L626,165" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,217 L626,217" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,269 L626,269" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M600,321 L626,321" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="627" y="40" width="156" height="302" rx="4" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.6"/>
  <text x="705" y="160" font-size="12" font-weight="700" fill="#1A4D3E" text-anchor="middle">одобрение</text>
  <text x="705" y="175" font-size="12" font-weight="700" fill="#1A4D3E" text-anchor="middle">запись</text>
  <text x="705" y="200" font-size="10.5" fill="#1A202C" text-anchor="middle">решение + ответственный</text>
  <text x="705" y="216" font-size="10.5" fill="#991B1B" text-anchor="middle">нет ответственного: отказ</text>
