<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Spatial belief record lifecycle (Ch9 @fig-09-spatial-belief-state-machine).
       Invariants sit inside the states; guards sit on the edges.
       Colors follow books/vol4/tex/theme-colors.tex roles: measured #007A87,
       proposal #B87333 (bounded prediction), consequence #A51C30, softink #4A5568. -->
  <defs>
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A51C30"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#FFFFFF"/>

  <!-- Return rails to VALID (fresh evidence) -->
  <path d="M 580 110 L 580 40 L 110 40 L 110 106" fill="none" stroke="#007A87" stroke-width="1.6" marker-end="url(#arr-petrol)"/>
  <path d="M 340 110 L 340 70 L 140 70 L 140 106" fill="none" stroke="#007A87" stroke-width="1.6" marker-end="url(#arr-petrol)"/>
  <text x="345" y="32" font-size="8.5" font-weight="600" fill="#007A87" text-anchor="middle" transform=" translate(344.99998474121094 0) scale(0.6625550695902764 1) translate(-344.99998474121094 0)" data-ru-fit="0.6626">актуальные свидетельства ∧ проверка невязки ∧ модель проверена заново</text>
  <text x="240" y="64" font-size="8" fill="#007A87" text-anchor="middle" transform=" translate(240.00001335144043 0) scale(0.7207752635654915 1) translate(-240.00001335144043 0)" data-ru-fit="0.7208">та же проверка</text>

  <!-- VALID -->
  <rect x="40" y="110" width="140" height="54" rx="3" fill="#E6F2F3" stroke="#007A87" stroke-width="1.6"/>
  <text x="110" y="132" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">ДЕЙСТВУЕТ</text>
  <text x="110" y="150" font-size="8.5" fill="#475569" text-anchor="middle">измерено, E ≤ e<tspan font-size="7.5" dy="2.5">max</tspan></text>

  <!-- VALID -> DEGRADED -->
  <line x1="180" y1="137" x2="266" y2="137" stroke="#B87333" stroke-width="1.6" marker-end="url(#arr-bronze)"/>
  <text x="224" y="129" font-size="8.5" font-weight="600" fill="#B87333" text-anchor="middle" transform=" translate(224.00000190734863 0) scale(0.9387755606622318 1) translate(-224.00000190734863 0)" data-ru-fit="0.9388">окклюзия</text>

  <!-- DEGRADED -->
  <rect x="270" y="110" width="140" height="54" rx="3" fill="#F6EDE4" stroke="#B87333" stroke-width="1.6"/>
  <text x="340" y="132" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">УХУДШЕНО</text>
  <text x="340" y="150" font-size="8.5" fill="#475569" text-anchor="middle">предсказано, E(Δt) ≤ e<tspan font-size="7.5" dy="2.5">max</tspan></text>

  <!-- DEGRADED -> EXPIRED -->
  <line x1="410" y1="137" x2="506" y2="137" stroke="#A51C30" stroke-width="1.6" marker-end="url(#arr-crimson)"/>
  <text x="458" y="129" font-size="8.5" font-weight="600" fill="#A51C30" text-anchor="middle">E(Δt) = e<tspan font-size="7.5" dy="2.5">max</tspan></text>
  <text x="458" y="154" font-size="8" fill="#A51C30" text-anchor="middle" transform=" translate(458 0) scale(0.711696167632164 1) translate(-458 0)" data-ru-fit="0.7117">или выход за область</text>

  <!-- EXPIRED -->
  <rect x="510" y="110" width="140" height="54" rx="3" fill="#F6E8EA" stroke="#A51C30" stroke-width="1.6"/>
  <text x="580" y="132" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">ИСТЁК</text>
  <text x="580" y="150" font-size="8.5" fill="#475569" text-anchor="middle">не допускает движения</text>

  <!-- ANY -> UNOBSERVABLE (bus) -->
  <line x1="80" y1="164" x2="80" y2="221" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <path d="M 340 164 L 340 250" fill="none" stroke="#4A5568" stroke-width="1.4"/>
  <path d="M 580 164 L 580 250 L 196 250" fill="none" stroke="#4A5568" stroke-width="1.4" marker-end="url(#arr-ink)"/>
  <circle cx="340" cy="250" r="2.4" fill="#4A5568"/>
  <text x="460" y="243" font-size="8.5" font-weight="600" fill="#4A5568" text-anchor="middle" transform=" translate(459.9999542236328 0) scale(0.6810422165283527 1) translate(-459.9999542236328 0)" data-ru-fit="0.6810">потеря наблюдаемости (из любого состояния)</text>

  <!-- UNOBSERVABLE -->
  <rect x="40" y="225" width="152" height="54" rx="3" fill="#F8FAFC" stroke="#4A5568" stroke-width="1.6"/>
  <text x="116" y="247" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">НЕНАБЛЮДАЕМО</text>
  <text x="116" y="265" font-size="8.5" fill="#475569" text-anchor="middle">состояние с неполным рангом</text>

  <!-- UNOBSERVABLE -> VALID -->
  <line x1="150" y1="225" x2="150" y2="168" stroke="#007A87" stroke-width="1.6" marker-end="url(#arr-petrol)"/>
  <text x="158" y="192" font-size="8" font-weight="600" fill="#007A87" transform=" translate(158 0) scale(0.6411617513511055 1) translate(-158 0)" data-ru-fit="0.6412">ограничение восстановлено</text>
  <text x="158" y="203" font-size="8" font-weight="600" fill="#007A87" transform=" translate(158 0) scale(0.755280722932609 1) translate(-158 0)" data-ru-fit="0.7553">+ та же проверка</text>
