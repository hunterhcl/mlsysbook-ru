<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
  </defs>

  <rect width="680" height="364" fill="#ffffff"/>

  <!-- Execution-substrate regions (drawn first so nothing crosses text) -->
  <rect x="206" y="28" width="336" height="228" rx="4" fill="none" stroke="#1A4D3E" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="214" y="42" font-size="9" font-weight="700" fill="#1A4D3E">прошивка МК безопасности, 1 kHz</text>
  <rect x="206" y="266" width="258" height="86" rx="4" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="214" y="280" font-size="9" font-weight="700" fill="#475569" transform=" translate(214 0) scale(0.9662921348314607 1) translate(-214 0)" data-ru-fit="0.9663">аппаратная блокировка, без программного обеспечения</text>

  <!-- Column labels -->
  <text x="105" y="18" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" transform=" translate(105 0) scale(0.7369252369252369 1) translate(-105 0)" data-ru-fit="0.7369">выбирается, когда</text>
  <text x="335" y="18" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">реакция</text>
  <text x="508" y="18" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" transform=" translate(508 0) scale(0.8977485928705441 1) translate(-508 0)" data-ru-fit="0.8977">арбитр</text>
  <text x="625" y="18" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle" transform=" translate(625 0) scale(0.6794571829667758 1) translate(-625 0)" data-ru-fit="0.6795">объект</text>

  <!-- Trigger cards -->
  <rect x="20" y="52" width="170" height="52" rx="3" fill="#FBF4EE" stroke="#B87333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="30" y="73" font-size="9.5" font-weight="700" fill="#8A5626">предложение u<tspan baseline-shift="sub" font-size="75%">nom</tspan> допущено</text>
  <text x="30" y="89" font-size="9" fill="#475569" transform=" translate(30 0) scale(0.9240657423560739 1) translate(-30 0)" data-ru-fit="0.9241">допуск актуален, множество допустимо</text>

  <rect x="20" y="122" width="170" height="52" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="30" y="143" font-size="9.5" font-weight="700" fill="#1E293B">стоит на месте</text>
  <text x="30" y="159" font-size="9" fill="#475569" transform=" translate(30 0) scale(0.9641693811074918 1) translate(-30 0)" data-ru-fit="0.9642">истёк допуск или контрольный сигнал</text>

  <rect x="20" y="192" width="170" height="52" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="30" y="213" font-size="9.5" font-weight="700" fill="#1E293B">в движении</text>
  <text x="30" y="229" font-size="9" fill="#475569" transform=" translate(30 0) scale(0.628136312570216 1) translate(-30 0)" data-ru-fit="0.6281">истечение срока, ошибка слежения или пустое множество</text>

  <rect x="20" y="286" width="170" height="52" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="30" y="307" font-size="9.5" font-weight="700" fill="#1E293B">Пропущен цикл МК</text>
  <text x="30" y="323" font-size="9" fill="#475569" transform=" translate(30 0) scale(0.783678554742252 1) translate(-30 0)" data-ru-fit="0.7837">срабатывает независимый сторожевой таймер</text>

  <!-- Trigger to response connectors -->
  <line x1="190" y1="78" x2="218" y2="78" stroke="#B87333" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr-bronze)"/>
  <line x1="190" y1="148" x2="218" y2="148" stroke="#475569" stroke-width="1" marker-end="url(#arr-slate)"/>
  <line x1="190" y1="218" x2="218" y2="218" stroke="#475569" stroke-width="1" marker-end="url(#arr-slate)"/>
  <line x1="190" y1="312" x2="218" y2="312" stroke="#475569" stroke-width="1" marker-end="url(#arr-slate)"/>

  <!-- Response cards: MCU rungs -->
  <rect x="220" y="50" width="230" height="56" rx="3" fill="#EAF1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="232" y="67" font-size="10" font-weight="700" fill="#1A4D3E">PROJECT</text>
  <text x="232" y="83" font-size="9" fill="#1E293B">u* = argmin ½ | |u − u<tspan baseline-shift="sub" font-size="75%">nom</tspan>| |²</text>
  <text x="232" y="98" font-size="9" fill="#1E293B">при условии ḣ ≥ −κ(h)</text>

  <rect x="220" y="120" width="230" height="56" rx="3" fill="#EAF1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="232" y="137" font-size="10" font-weight="700" fill="#1A4D3E">HOLD</text>
  <text x="232" y="153" font-size="9" fill="#1E293B">активное удержание положения</text>
  <text x="232" y="168" font-size="9" fill="#475569">SS2, затем контроль покоя</text>

  <rect x="220" y="190" width="230" height="56" rx="3" fill="#EAF1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="232" y="207" font-size="10" font-weight="700" fill="#1A4D3E">STOP</text>
  <text x="232" y="223" font-size="9" fill="#1E293B">встроенное C²-завершение останова</text>
  <text x="232" y="238" font-size="9" fill="#475569">SS1, контроль профиля замедления</text>

  <!-- Response card: hardware rung -->
  <rect x="220" y="284" width="230" height="56" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="232" y="301" font-size="10" font-weight="700" fill="#334155">INHIBIT</text>
  <text x="232" y="317" font-size="9" fill="#1E293B">STO: питание затворных драйверов снято</text>
  <text x="232" y="332" font-size="9" fill="#1E293B">пружинный тормоз включен (обесточен)</text>

  <!-- Rungs into the arbiter -->
  <line x1="450" y1="78" x2="490" y2="78" stroke="#1A4D3E" stroke-width="2"/>
  <circle cx="490" cy="78" r="2.8" fill="#1A4D3E"/>
  <line x1="450" y1="148" x2="490" y2="148" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="490" cy="148" r="2.4" fill="#94A3B8"/>
  <line x1="450" y1="218" x2="490" y2="218" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="490" cy="218" r="2.4" fill="#94A3B8"/>

  <!-- Arbiter (multiplexer) -->
  <polygon points="490,56 526,82 526,214 490,240" fill="#F8FAFC" stroke="#334155" stroke-width="1.4"/>
  <line x1="490" y1="78" x2="526" y2="148" stroke="#1A4D3E" stroke-width="1.8"/>

  <!-- Plant: drives and brakes -->
  <rect x="592" y="52" width="70" height="288" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="627" y="70" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">приводы</text>
  <text x="627" y="84" font-size="9" fill="#475569" text-anchor="middle">и тормоза</text>

  <!-- Arbiter output: torque command -->
  <line x1="526" y1="148" x2="590" y2="148" stroke="#1A4D3E" stroke-width="2" marker-end="url(#arr-pine)"/>
  <text x="558" y="141" font-size="9.5" font-weight="700" fill="#1A4D3E" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">act</tspan></text>

  <!-- Hardware path: STO and brake supply, bypassing the arbiter -->
  <line x1="450" y1="312" x2="590" y2="312" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>
  <text x="528" y="305" font-size="9" font-weight="700" fill="#475569" text-anchor="middle" transform=" translate(528 0) scale(0.7872075358149366 1) translate(-528 0)" data-ru-fit="0.7872">STO, питание тормоза</text>
