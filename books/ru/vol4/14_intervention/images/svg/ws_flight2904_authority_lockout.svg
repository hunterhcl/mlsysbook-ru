<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Timing strip, to scale: t = 0 at right-gear contact; x = 190 + 30 px per second.
       Drawn values are guarded by the chapter cell calc-intervention-flight2904-strip. -->
  <rect width="680" height="344" fill="#ffffff"/>

  <!-- ===== Guides (drawn first) ===== -->
  <line x1="460" y1="30" x2="460" y2="300" stroke="#4A5568" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="580" y1="30" x2="580" y2="300" stroke="#4A5568" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="460" y="22" text-anchor="middle" font-size="9" fill="#1A202C" transform=" translate(460 0) scale(0.7479110607562668 1) translate(-460 0)" data-ru-fit="0.7479">касание левой стойки, 9 s</text>
  <text x="580" y="22" text-anchor="middle" font-size="9" fill="#1A202C" transform=" translate(580 0) scale(0.6134667064795462 1) translate(-580 0)" data-ru-fit="0.6135">тормоза действуют, 13 s</text>

  <!-- ===== Row labels ===== -->
  <g font-size="9.5" font-weight="700" fill="#1A202C">
    <text x="20" y="47" transform=" translate(20 0) scale(0.46321439848437007 1) translate(-20 0)" data-ru-fit="0.4632">правая основная стойка шасси</text>
    <text x="20" y="91" transform=" translate(20 0) scale(0.4359339096181201 1) translate(-20 0)" data-ru-fit="0.4359">левая основная стойка шасси</text>
    <text x="20" y="135" transform=" translate(20 0) scale(0.8336736588082421 1) translate(-20 0)" data-ru-fit="0.8337">команда экипажа</text>
    <text x="20" y="179" transform=" translate(20 0) scale(0.600982605231709 1) translate(-20 0)" data-ru-fit="0.6010">наземные интерцепторы</text>
    <text x="20" y="223" transform=" translate(20 0) scale(0.9523414836303357 1) translate(-20 0)" data-ru-fit="0.9523">реверсоры тяги</text>
    <text x="20" y="267" transform=" translate(20 0) scale(0.6795142555438226 1) translate(-20 0)" data-ru-fit="0.6795">колесные тормоза</text>
  </g>
  <g font-size="8.5" fill="#4A5568">
    <text x="20" y="59" transform=" translate(20 0) scale(0.7224412124507272 1) translate(-20 0)" data-ru-fit="0.7224">приземляется в момент t = 0</text>
    <text x="20" y="103" transform=" translate(20 0) scale(0.854916067146283 1) translate(-20 0)" data-ru-fit="0.8549">стойка сжимается при 9 s</text>
    <text x="20" y="147" transform=" translate(20 0) scale(0.910864506890997 1) translate(-20 0)" data-ru-fit="0.9109">тормоза и реверсоры</text>
    <text x="20" y="191" transform=" translate(20 0) scale(0.9465139875344253 1) translate(-20 0)" data-ru-fit="0.9465">обе стойки или оба колеса</text>
    <text x="20" y="201">выше 72 kt</text>
    <text x="20" y="235">обе стойки сжаты</text>
    <text x="20" y="279" transform=" translate(20 0) scale(0.8449540061325157 1) translate(-20 0)" data-ru-fit="0.8450">раскрутка колёс обеих стоек</text>
  </g>

  <!-- ===== Gear rows ===== -->
  <line x1="190" y1="50" x2="640" y2="50" stroke="#1A202C" stroke-width="2"/>
  <circle cx="190" cy="50" r="4" fill="#1A202C"/>
  <text x="200" y="44" font-size="8.5" fill="#4A5568">на земле</text>
  <line x1="190" y1="94" x2="460" y2="94" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="88" font-size="8.5" fill="#4A5568">стойка не сжата</text>
  <line x1="460" y1="94" x2="640" y2="94" stroke="#1A202C" stroke-width="2"/>
  <circle cx="460" cy="94" r="4" fill="#1A202C"/>

  <!-- ===== Crew command (constant from touchdown) ===== -->
  <rect x="190" y="130" width="450" height="16" rx="0" fill="#EFEDF5" stroke="#5B4B8A" stroke-width="1.2"/>
  <text x="415" y="141.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5B4B8A">команда с момента касания</text>

  <!-- ===== Spoilers ===== -->
  <rect x="190" y="174" width="270" height="16" rx="0" fill="#F9E9EB" stroke="#A51C30" stroke-width="1.2"/>
  <text x="325" y="185.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#A51C30">заблокирован</text>
  <rect x="460" y="174" width="180" height="16" rx="0" fill="#E9F1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="550" y="185.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1A4D3E">развернут</text>

  <!-- ===== Reversers ===== -->
  <rect x="190" y="218" width="270" height="16" rx="0" fill="#F9E9EB" stroke="#A51C30" stroke-width="1.2"/>
  <text x="325" y="229.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#A51C30">заблокирован</text>
  <rect x="460" y="218" width="180" height="16" rx="0" fill="#E9F1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="550" y="229.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1A4D3E">развернут</text>

  <!-- ===== Wheel brakes ===== -->
  <rect x="190" y="262" width="390" height="16" rx="0" fill="#F9E9EB" stroke="#A51C30" stroke-width="1.2"/>
  <text x="385" y="273.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#A51C30">нет торможения: колеса аквапланируют</text>
  <rect x="580" y="262" width="60" height="16" rx="0" fill="#E9F1EE" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="610" y="273.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1A4D3E">торможение</text>

  <!-- ===== Time axis ===== -->
  <line x1="190" y1="300" x2="640" y2="300" stroke="#1A202C" stroke-width="1"/>
  <g stroke="#1A202C" stroke-width="1">
    <line x1="190" y1="300" x2="190" y2="305"/>
    <line x1="250" y1="300" x2="250" y2="305"/>
    <line x1="310" y1="300" x2="310" y2="305"/>
    <line x1="370" y1="300" x2="370" y2="305"/>
    <line x1="430" y1="300" x2="430" y2="305"/>
    <line x1="490" y1="300" x2="490" y2="305"/>
    <line x1="550" y1="300" x2="550" y2="305"/>
    <line x1="610" y1="300" x2="610" y2="305"/>
  </g>
  <g font-size="8.5" fill="#4A5568" text-anchor="middle">
    <text x="190" y="316">0</text>
    <text x="250" y="316">2</text>
    <text x="310" y="316">4</text>
    <text x="370" y="316">6</text>
    <text x="430" y="316">8</text>
    <text x="490" y="316">10</text>
    <text x="550" y="316">12</text>
    <text x="610" y="316">14</text>
  </g>
  <text x="415" y="334" text-anchor="middle" font-size="9" fill="#1A202C" transform=" translate(415 0) scale(0.7486359360301035 1) translate(-415 0)" data-ru-fit="0.7486">время после касания правой стойки (s)</text>
