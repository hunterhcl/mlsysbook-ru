<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4A5568"/>
    </marker>
    <marker id="arr-pine" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1A4D3E"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#ffffff"/>

  <!-- ============ APPLICATION SoC (one die) ============ -->
  <rect x="20" y="20" width="410" height="262" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.2"/>
  <text x="32" y="38" font-size="10.5" font-weight="bold" fill="#1A202C">Прикладная СнК: один кристалл, один корпус</text>

  <!-- compute row -->
  <rect x="32" y="50" width="88" height="54" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.1"/>
  <text x="76" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">прикладной</text>
  <text x="76" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">ядра</text>
  <text x="76" y="97" font-size="8" fill="#4A5568" text-anchor="middle" transform=" translate(76 0) scale(0.7165789828679348 1) translate(-76 0)" data-ru-fit="0.7166">Linux, генератор предложений</text>

  <rect x="128" y="50" width="88" height="54" rx="3" fill="#FBF3EC" stroke="#B87333" stroke-width="1.1"/>
  <text x="172" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">нейронный</text>
  <text x="172" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">ускоритель</text>
  <text x="172" y="97" font-size="8" fill="#4A5568" text-anchor="middle">политика фрагментов</text>

  <rect x="224" y="50" width="88" height="54" rx="3" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.1"/>
  <text x="268" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle" transform=" translate(268 0) scale(0.8937034529451591 1) translate(-268 0)" data-ru-fit="0.8937">в реальном времени</text>
  <text x="268" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">кластер</text>
  <text x="268" y="97" font-size="8" fill="#4A5568" text-anchor="middle">домен хоста</text>

  <!-- safety island: own crystal, rail, TCM -->
  <rect x="330" y="50" width="88" height="128" rx="3" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.1" stroke-dasharray="5,3"/>
  <text x="374" y="72" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">безопасность</text>
  <text x="374" y="84" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">остров</text>
  <text x="374" y="97" font-size="8" fill="#4A5568" text-anchor="middle">не включено</text>
  <text x="374" y="107" font-size="8" fill="#4A5568" text-anchor="middle">на модуле</text>
  <rect x="340" y="116" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="127.5" font-size="8" fill="#1A202C" text-anchor="middle" transform=" translate(374 0) scale(0.8565965583173997 1) translate(-374 0)" data-ru-fit="0.8566">собственный кварц</text>
  <rect x="340" y="136" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="147.5" font-size="8" fill="#1A202C" text-anchor="middle" transform=" translate(374 0) scale(0.90892696122633 1) translate(-374 0)" data-ru-fit="0.9089">собственная шина</text>
  <rect x="340" y="156" width="68" height="16" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="167.5" font-size="8" fill="#1A202C" text-anchor="middle">TCM, SRAM</text>

  <!-- shared die infrastructure (a tick on the die can lose these) -->
  <g font-size="9" fill="#1A202C" text-anchor="middle">
    <rect x="32" y="116" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="100" y="131">кеш последнего уровня</text>
    <rect x="176" y="116" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="244" y="131">Контроллер DRAM</text>
    <rect x="32" y="144" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="100" y="159">регулятор тактовой частоты</text>
    <rect x="176" y="144" width="136" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="244" y="159">шина питания ядра</text>
    <rect x="32" y="172" width="280" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
    <text x="172" y="187">цепочка сброса и загрузки</text>
  </g>
  <!-- on-chip fabric spans all four blocks; island sits behind a firewall -->
  <rect x="32" y="202" width="386" height="22" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="172" y="217" font-size="9" fill="#1A202C" text-anchor="middle">внутрикристальная сеть (передаёт предложения)</text>
  <line x1="374" y1="178" x2="374" y2="202" stroke="#1A4D3E" stroke-width="1.1"/>
  <rect x="340" y="185" width="68" height="12" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.8"/>
  <text x="374" y="194" font-size="8" fill="#1A4D3E" text-anchor="middle">брандмауэр</text>
  <!-- die temperature and package: shared even by the island -->
  <rect x="32" y="234" width="386" height="36" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="225" y="250" font-size="9" fill="#1A202C" text-anchor="middle">температура кристалла, корпус, путь теплоотвода</text>
  <text x="225" y="263" font-size="8" fill="#4A5568" text-anchor="middle">общая для всех блоков кристалла</text>

  <!-- external DRAM -->
  <line x1="244" y1="282" x2="244" y2="298" stroke="#A51C30" stroke-width="1.2"/>
  <rect x="176" y="298" width="136" height="26" rx="0" fill="#FBEFF1" stroke="#A51C30" stroke-width="1"/>
  <text x="244" y="315" font-size="9" fill="#1A202C" text-anchor="middle">LPDDR5 DRAM</text>

  <!-- placement badges (a) (b) (c) -->
  <g font-size="9" font-weight="bold" text-anchor="middle">
    <circle cx="112" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="112" y="61.2" fill="#1A202C">a</text>
    <circle cx="304" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="304" y="61.2" fill="#1A202C">b</text>
    <circle cx="410" cy="58" r="7.5" fill="#ffffff" stroke="#1A202C" stroke-width="1"/>
    <text x="410" y="61.2" fill="#1A202C">c</text>
  </g>

  <!-- ============ board link ============ -->
  <text x="455" y="182" font-size="8.5" font-weight="bold" fill="#1A202C" text-anchor="middle" transform=" translate(455 0) scale(0.4968591282736376 1) translate(-455 0)" data-ru-fit="0.4969">межплатный канал</text>
  <text x="462" y="228" font-size="8" fill="#4A5568" text-anchor="middle" transform=" translate(462 0) scale(0.5653333333333334 1) translate(-462 0)" data-ru-fit="0.5653">CRC, последовательность</text>

  <!-- ============ DISCRETE SAFETY MCU ============ -->
  <rect x="502" y="20" width="158" height="220" rx="0" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1.3"/>
  <text x="514" y="38" font-size="10.5" font-weight="bold" fill="#1A202C" transform=" translate(514 0) scale(0.8100242522231205 1) translate(-514 0)" data-ru-fit="0.8100">Отдельный МК безопасности</text>
  <text x="514" y="51" font-size="8" fill="#4A5568">собственный корпус</text>
  <circle cx="645" cy="34" r="7.5" fill="#1A4D3E" stroke="#1A4D3E" stroke-width="1"/>
  <text x="645" y="37.2" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">d</text>
  <g font-size="9" fill="#1A202C" text-anchor="middle">
    <rect x="514" y="60" width="134" height="30" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="73" font-weight="bold" transform=" translate(581 0) scale(0.8568451760783496 1) translate(-581 0)" data-ru-fit="0.8568">ядра с синхронным исполнением</text>
    <text x="581" y="85" font-size="8" fill="#4A5568">400 MHz, такт 1 kHz</text>
    <rect x="514" y="96" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="111">TCM, без общей DRAM</text>
    <rect x="514" y="124" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="139">собственные часы</text>
    <rect x="514" y="152" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="167">контроллер сброса</text>
    <rect x="514" y="180" width="134" height="22" rx="0" fill="#ffffff" stroke="#1A4D3E" stroke-width="0.9"/>
    <text x="581" y="195">локальный почтовый ящик</text>
  </g>
  <text x="581" y="224" font-size="8" fill="#4A5568" text-anchor="middle">единственный ведущий шины приводов</text>

  <!-- MCU to drives -->
  <path d="M600,240 V262" fill="none" stroke="#1A4D3E" stroke-width="1.3" marker-end="url(#arr-pine)"/>
  <rect x="534" y="264" width="126" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
  <text x="597" y="281" font-size="9" fill="#1A202C" text-anchor="middle">EtherCAT к приводам</text>

  <!-- isolated rail -->
  <rect x="502" y="310" width="158" height="30" rx="0" fill="#EEF4F1" stroke="#1A4D3E" stroke-width="1"/>
  <text x="581" y="323" font-size="9" font-weight="bold" fill="#1A202C" text-anchor="middle">изолированная шина</text>
  <text x="581" y="335" font-size="8" fill="#4A5568" text-anchor="middle">поддержка питания 2 s</text>
  <path d="M514,310 V240" fill="none" stroke="#1A4D3E" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- ============ common board supply ============ -->
  <rect x="20" y="356" width="640" height="28" rx="0" fill="#F4F6F9" stroke="#4A5568" stroke-width="1"/>
  <text x="340" y="374" font-size="9" fill="#1A202C" text-anchor="middle">батарея и общее питание платы: общие для всех четырёх размещений</text>
  <path d="M60,356 V282" fill="none" stroke="#4A5568" stroke-width="1.1" stroke-dasharray="3,2"/>
  <path d="M581,356 V340" fill="none" stroke="#4A5568" stroke-width="1.1" stroke-dasharray="3,2"/>
  <path d="M418,213 H478 V191 H513" fill="none" stroke="#4A5568" stroke-width="1.3" marker-end="url(#arr-slate)"/>
